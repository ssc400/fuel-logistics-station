<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--pri:#3A5C4A;--pri-l:#E8F0E8;--pri-d:#2A4A38;--gold:#8DA48E;--gold-l:#E6EDE6;--gold-d:#6A8A6E;--ok:#3A5C4A;--ok-l:#E8F0E8;--warn:#EC935E;--err:#C65D52;--bg:#F2F0EB;--w:#fff;--bd:#E8E4DA;--t:#2C2A28;--t2:#5A5852;--shadow:rgba(58,92,74,.1)}
html,body{height:100%;font-family:-apple-system,'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--t);-webkit-font-smoothing:antialiased}
.app{display:flex;height:100vh}
.sb{width:220px;background:#E8E4DA;color:#2C2A28;display:flex;flex-direction:column;z-index:100;flex-shrink:0;border-right:1px solid #D8D4CA}
.sb-h{padding:16px;border-bottom:1px solid #D8D4CA}
.nav{flex:1;padding:8px 0;overflow-y:auto}
.ni{display:flex;align-items:center;gap:10px;padding:11px 22px;color:#5A5852;cursor:pointer;font-size:.88rem;border-left:3px solid transparent;user-select:none;transition:all .25s;letter-spacing:.3px}
.ni:hover{background:#E8F0E8;color:#3A5C4A}
.ni.on{background:#E8F0E8;color:#3A5C4A;border-left-color:#3A5C4A;font-weight:600}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.hd{height:56px;background:var(--w);border-bottom:2px solid var(--pri);display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 1px 6px var(--shadow)}
.hd #pgTitle{font-size:1.02rem;font-weight:600;color:var(--pri);letter-spacing:.5px}.hd #pgDate{font-size:.82rem;color:var(--t2)}
.ct{flex:1;overflow-y:auto;padding:20px}
.cd{background:var(--w);border-radius:8px;box-shadow:0 1px 4px var(--shadow);margin-bottom:16px;overflow:hidden;border:1px solid var(--bd)}
.cd-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--bd);flex-wrap:wrap;gap:6px}
.cd-t{font-size:.95rem;font-weight:600;color:var(--pri);letter-spacing:.3px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border:none;border-radius:5px;font-size:.85rem;cursor:pointer;font-weight:500;transition:all .2s;text-decoration:none}
.btn-p{background:var(--pri);color:#fff}.btn-p:hover{background:var(--pri-d);box-shadow:0 2px 6px rgba(58,92,74,.25)}
.btn-o{background:transparent;color:var(--t2);border:1px solid var(--bd)}.btn-o:hover{border-color:var(--gold);color:var(--gold)}
.btn-s{background:var(--gold);color:#fff}.btn-s:hover{background:var(--gold-d);box-shadow:0 2px 6px rgba(141,164,142,.25)}
.btn-w{background:var(--warn);color:#fff}.btn-d{background:var(--err);color:#fff}.btn-sm{padding:4px 10px;font-size:.8rem}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.sc{background:var(--w);border-radius:8px;padding:18px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 4px var(--shadow);border:1px solid var(--bd)}
.si{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.si-b{background:var(--pri-l);color:var(--pri)}.si-g{background:var(--gold-l);color:var(--gold)}.si-o{background:#FDF3E7;color:#EC935E}.si-p{background:#E8F0E8;color:#3A5C4A}.si-r{background:#F5E4E0;color:#C65D52}
.sc h3{font-size:1.4rem;font-weight:700;color:var(--t)}.sc p{font-size:.8rem;color:var(--t2)}
.tc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.84rem}
th{background:#EEEBE3;padding:9px 11px;text-align:left;font-weight:600;font-size:.8rem;color:#6B645C;border-bottom:2px solid #E8E4DA;letter-spacing:.3px}td{padding:8px 11px;border-bottom:1px solid #EDE9E1}tr:hover td{background:#E8F0E8}
.uz{border:2px dashed var(--bd);border-radius:8px;padding:28px 18px;text-align:center;cursor:pointer;transition:all .2s;background:var(--w)}
.uz:hover{border-color:var(--pri);background:var(--pri-l)}
.tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:2px solid var(--bd)}
.tab{padding:9px 18px;cursor:pointer;font-size:.87rem;color:var(--t2);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;letter-spacing:.3px}
.tab:hover{color:var(--pri)}.tab.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.msg{position:fixed;top:20px;right:20px;padding:10px 18px;border-radius:6px;color:#fff;font-size:.85rem;z-index:9999;max-width:380px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.msg-i{background:var(--pri)}.msg-s{background:var(--gold)}.msg-w{background:#EC935E}.msg-e{background:#C65D52}
.menu-btn{display:none}.menu-btn:hover{background:#E8F0E8;color:#3A5C4A}.sb-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(42,74,56,.4);z-index:199;display:none}
select{padding:6px 10px;border:1px solid var(--bd);border-radius:6px;font-size:.88rem;background:var(--w);outline:none}
select:focus{border-color:var(--pri)}
input[type=date]{padding:6px 10px;border:1px solid var(--bd);border-radius:6px;font-size:.88rem;outline:none}
input[type=date]:focus{border-color:var(--pri)}
/* ===== Global Drag & Drop Upload ===== */
.app-drag-zone{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(58,92,74,.92);backdrop-filter:blur(4px);animation:dragFadeIn .2s ease}
.app-drag-zone.show{display:flex}
.app-drag-inner{text-align:center;padding:60px 80px;border:3px dashed rgba(255,255,255,.5);border-radius:24px;background:rgba(255,255,255,.08);max-width:480px}
.app-drag-icon{font-size:56px;margin-bottom:12px;animation:dragBounce .8s ease-in-out infinite alternate}
.app-drag-text{font-size:20px;font-weight:600;color:#fff;margin-bottom:6px;letter-spacing:1px}
.app-drag-hint{font-size:13px;color:rgba(255,255,255,.6)}
@keyframes dragFadeIn{from{opacity:0}to{opacity:1}}
@keyframes dragBounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}
@media(max-width:768px){
  .sb{width:0;overflow:hidden;position:fixed;left:0;top:0;height:100vh;z-index:200;transition:width .3s}
  .sb.show{width:220px}
  .sg{grid-template-columns:1fr 1fr}
  .menu-btn{display:inline-flex!important}
}
</style>

})();
</script></head>

<script>
function msg(type,text){
  var d=document.createElement('div');
  d.className='msg msg-'+type;
  d.textContent=text;
  document.body.appendChild(d);
  setTimeout(function(){d.remove()},3000);
}
var pgTitle=document.getElementById('pgTitle');
var ct=document.getElementById('ct');
var navItems=document.querySelectorAll('.ni');
var curPage='outbound';
var curRoIdx=0;
function toggleSb(){
  var sb=document.getElementById('sb');
  var ov=document.getElementById('sbOverlay');
  sb.classList.toggle('show');
  ov.style.display=sb.classList.contains('show')?'block':'none';
}
function hideSb(){
  document.getElementById('sb').classList.remove('show');
  document.getElementById('sbOverlay').style.display='none';
}
// ===== 工作空间访问地址（演示页同步，随部署自动更新，永不失效） =====
function copySiteLink(e){
  if(e&&e.preventDefault)e.preventDefault();
  var u=location.href;
  var done=function(){
    var b=document.getElementById('siteLinkBtn');
    if(b){var t=b.getAttribute('data-label')||b.textContent;b.textContent='✅ 已复制';setTimeout(function(){b.textContent=t;},1500);}
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(u).then(done,function(){fallbackCopy(u);done();});
  }else{fallbackCopy(u);done();}
}
function fallbackCopy(t){
  var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);
}
function initSiteLink(){
  var a=document.getElementById('siteLink');
  if(a){a.href=location.href;a.textContent='🔗 '+location.host;}
}
if(document.readyState!=='loading'){initSiteLink();}else{document.addEventListener('DOMContentLoaded',initSiteLink);}
function go(p){
  curPage=p;
  navItems.forEach(function(n){n.classList.toggle('on',n.dataset.p===p);});
  hideSb(); // 手机端点击导航后收起侧栏
  var titles={supply:'📦 互供工作',distance:'📏 运距复核',freight:'🚚 运费核算',sort:'📊 油品出库点优先级排序',delivery:'🔮 智能配送','delivery-module':'📝 配送计划统计',procurement:'📸 外采管理',intel:'🛰️ 情报收集',analysis:'📊 数据分析',todo:'📋 待办事项',db:'🗄️ 数据库管理'};
  pgTitle.textContent=titles[p]||'';
  ct.innerHTML='';
  // 恢复默认样式（解决出库排序页面的padding修改）
  ct.style.padding='';
  ct.style.overflow='';
  ct.style.display='';
  ct.style.flexDirection='';
  if(p==='supply') rs(ct);
  else if(p==='distance') rd(ct);
  else if(p==='freight') rf(ct);
  else if(p==='sort') so(ct);
  else if(p==='delivery') rdelivery(ct);
  else if(p==='procurement') rprocurement(ct);
  else if(p==='delivery-module') rdeliveryModule(ct);
  else if(p==='intel') rintel(ct);
  else if(p==='analysis') ranalysis(ct);
  else if(p==='todo') rtodo(ct);
  else if(p==='db') rdb(ct);
}
var S={
  get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};

// ===== 出库量统计 =====
function ro(c){
  c.innerHTML=
    '<div class="tabs">'+
      '<div class="tab on" onclick="rotab(this,0)">📊 出库综合分析</div>'+
      '<div class="tab" onclick="rotab(this,1)">🏢 参控股出库统计</div>'+
      '<div class="tab" onclick="rotab(this,2)">📦 批发&参控股分析</div>'+
    '</div>'+
    '<div id="roContent"></div>';
  rotab(null,0);
}
function rotab(el,idx){
  try{
    curRoIdx=idx;
    var tabs=document.querySelectorAll('.tabs .tab');
    tabs.forEach(function(t,i){t.classList.toggle('on',i===idx);});
    var rc=document.getElementById('roContent');
    if(!rc){setTimeout(function(){rotab(null,idx);},50);return;}
    if(idx===0) renderExportAnalysis(rc);
    else if(idx===1) renderPartnerStats(rc);
    else if(idx===2) renderWholesaleStats(rc);
  }catch(er){
    msg('e','页面错误：'+er.message);
    console.error(er);
  }
}

// ===== 出库综合分析（统一上传+筛选+油库互供/外采区分） =====
var exportData=null; // 全局缓存上传数据

function renderExportAnalysis(c){
  try{
    var html='';
    html+='<div class="cd"><div class="cd-h"><b class="cd-t">📥 上传出库记录</b></div><div style="padding:20px;">'+
      '<div class="uz" onclick="this.nextElementSibling.click()" style="max-width:400px;margin:0 auto;">'+
        '<div style="font-size:2rem;">📊</div>'+
        '<div style="font-weight:700;color:var(--pri);margin:8px 0 4px;">点击上传出库记录CSV</div>'+
        '<div style="font-size:.82rem;color:#888;margin-bottom:12px;">export(262).csv 格式 / 自动识别编码</div>'+
        '<button class="btn btn-p">选择文件</button>'+
      '</div>'+
      '<input type="file" accept=".csv" style="display:none;" onchange="loadExportCSV(this)">'+
    '</div></div>';
    // 如果有数据，渲染筛选+结果
    if(exportData&&exportData.records&&exportData.records.length){
      html+=renderExportFilters();
      html+=renderExportStats();
    }else{
      html+='<div class="cd"><div class="cd-h"><b class="cd-t">📈 统计分析</b></div><div style="padding:40px;text-align:center;color:#888;">请先上传出库记录CSV文件</div></div>';
    }
    c.innerHTML=html;
  }catch(er){
    msg('e','渲染错误：'+er.message);
    c.innerHTML='<div style="padding:40px;text-align:center;color:#f5222d;">页面渲染失败：'+er.message+'<br><button class="btn btn-p" onclick="location.reload()" style="margin-top:16px;">刷新页面</button></div>';
  }
}

function loadExportCSV(input){
  if(!input.files||!input.files[0])return;
  var f=input.files[0];
  msg('i','正在解析：'+f.name);
  var rd=new FileReader();
  rd.onload=function(e){
    try{
      var buf=e.target.result;
      var view=new Uint8Array(buf);
      var txt;
      if(view[0]===0xFF&&view[1]===0xFE) txt=new TextDecoder('utf-16le').decode(buf);
      else txt=new TextDecoder('gbk').decode(buf);
      var lines=txt.split('\n').filter(function(x){return x.trim();});
      if(lines.length<2){msg('w','文件无数据');return;}
      var header=lines[0].split('\t').map(function(x){return x.trim();});
      var idxDate=header.indexOf('业务时间');
      var idxDept=header.indexOf('编制单位');
      var idxShip=header.indexOf('发货单位');
      var idxSite=header.indexOf('提货单位');
      var idxOil=header.indexOf('油品名称');
      var idxTon=header.indexOf('实际记账量(吨)');
      var idxOutType=header.indexOf('出库类型');
      if(idxTon<0||idxShip<0){msg('e','缺少关键列');return;}
      var minD='',maxD='';
      var depts={},ships={},oils={},records=[];
      for(var i=1;i<lines.length;i++){
        var cols=lines[i].split('\t');
        if(cols.length<=idxTon)continue;
        var ton=parseFloat(cols[idxTon])||0;
        if(ton<=0)continue;
        var date=(cols[idxDate]||'').replace(/^=/,'').replace(/\"/g,'').trim().substring(0,10);
        if(date&&(!minD||date<minD))minD=date;
        if(date&&(!maxD||date>maxD))maxD=date;
        var dept=(cols[idxDept]||'').replace(/^=/,'').replace(/\"/g,'').trim();
        var ship=(cols[idxShip]||'').replace(/^=/,'').replace(/\"/g,'').trim();
        var oil=(cols[idxOil]||'').replace(/^=/,'').replace(/\"/g,'').trim();
        var outType=(cols[idxOutType]||'').replace(/^=/,'').replace(/\"/g,'').trim();
        var isD=oil.indexOf('柴油')>=0;
        var isG=!isD&&(oil.indexOf('92')>=0||oil.indexOf('95')>=0||oil.indexOf('98')>=0);
        records.push({date:date,dept:dept,ship:ship,site:site,oil:oil,ton:ton,outType:outType,isD:isD,isG:isG});
        if(dept) depts[dept]=1;
        if(ship) ships[ship]=1;
        if(oil) oils[oil]=1;
      }
      exportData={
        records:records,minDate:minD,maxDate:maxD,
        filterFrom:minD,filterTo:maxD,
        filterShip:'',filterDept:'',filterOil:'',
        deptList:Object.keys(depts).sort(),
        shipList:Object.keys(ships).sort(),
        oilList:Object.keys(oils).sort(),
        fileName:f.name
      };
      msg('s','解析完成！共 '+records.length+' 条记录');
      if(curPage==='outbound') rotab(null,0);
    }catch(er){msg('e','解析失败：'+er.message);}
  };
  rd.readAsArrayBuffer(f);
}

function renderExportFilters(){
  var d=exportData;
  var html='<div class="cd"><div class="cd-h"><b class="cd-t">🔍 筛选条件</b><span style="font-size:.82rem;color:#888;">共 '+d.records.length+' 条记录</span></div>'+
    '<div style="padding:16px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;">'+
    '<label>日期</label><input type="date" id="exFrom" value="'+d.filterFrom+'" onchange="applyExFilter()">'+
    '<span>~</span><input type="date" id="exTo" value="'+d.filterTo+'" onchange="applyExFilter()">'+
    '<label>油库</label><select id="exShip" onchange="applyExFilter()"><option value="">全部</option>';
  d.shipList.forEach(function(s){html+='<option value="'+s+'"'+(d.filterShip===s?' selected':'')+'>'+s+'</option>';});
  html+='</select><label>分公司</label><select id="exDept" onchange="applyExFilter()"><option value="">全部</option>';
  d.deptList.forEach(function(s){html+='<option value="'+s+'"'+(d.filterDept===s?' selected':'')+'>'+s+'</option>';});
  html+='</select><label>油品</label><select id="exOil" onchange="applyExFilter()"><option value="">全部</option>';
  d.oilList.forEach(function(s){html+='<option value="'+s+'"'+(d.filterOil===s?' selected':'')+'>'+s+'</option>';});
  html+='</select><button class="btn btn-p btn-sm" onclick="applyExFilter()">应用筛选</button></div></div>';
  return html;
}

function applyExFilter(){
  var d=exportData;
  if(!d)return;
  d.filterFrom=document.getElementById('exFrom')?document.getElementById('exFrom').value:d.filterFrom;
  d.filterTo=document.getElementById('exTo')?document.getElementById('exTo').value:d.filterTo;
  d.filterShip=document.getElementById('exShip')?document.getElementById('exShip').value:'';
  d.filterDept=document.getElementById('exDept')?document.getElementById('exDept').value:'';
  d.filterOil=document.getElementById('exOil')?document.getElementById('exOil').value:'';
  if(curPage==='outbound') rotab(null,0);
}

function renderExportStats(){
  var d=exportData;
  if(!d||!d.records||!d.records.length) return '<div class="cd"><div class="cd-h"><b class="cd-t">📈 统计结果</b></div><div style="padding:40px;text-align:center;color:#888;">暂无数据，请先上传出库记录</div></div>';
  // 按筛选条件过滤
  var rows=[];
  d.records.forEach(function(r){
    if(d.filterFrom&&r.date<d.filterFrom)return;
    if(d.filterTo&&r.date>d.filterTo)return;
    if(d.filterShip&&r.ship!==d.filterShip)return;
    if(d.filterDept&&r.dept!==d.filterDept)return;
    if(d.filterOil&&r.oil!==d.filterOil)return;
    rows.push(r);
  });
  if(rows.length===0) return '<div class="cd"><div class="cd-h"><b class="cd-t">📈 统计结果</b></div><div style="padding:40px;text-align:center;color:#888;">无匹配数据</div></div>';
  // 统计
  var total=0,diesel=0,gas=0,g92=0,g95=0,ge92=0,g98=0;
  var hgTotal=0,wcTotal=0; // 互供/外采
  var shipStats={}; // 按油库
  rows.forEach(function(r){
    total+=r.ton;
    if(r.isD) diesel+=r.ton;
    if(r.isG) gas+=r.ton;
    if(r.isG&&r.oil.indexOf('92')>=0&&r.oil.indexOf('乙醇')<0) g92+=r.ton;
    if(r.isG&&r.oil.indexOf('95')>=0) g95+=r.ton;
    if(r.isG&&r.oil.indexOf('92')>=0&&r.oil.indexOf('乙醇')>=0) ge92+=r.ton;
    if(r.isG&&r.oil.indexOf('98')>=0) g98+=r.ton;
    // 互供=内部调拨+内部移库，外采=批发
    var isHG=(r.outType.indexOf('调拨')>=0||r.outType.indexOf('移库')>=0);
    if(isHG) hgTotal+=r.ton; else wcTotal+=r.ton;
    // 按油库统计
    if(!shipStats[r.ship]) shipStats[r.ship]={total:0,hg:0,wc:0,diesel:0,gas:0,g92:0,g95:0,ge92:0,g98:0};
    shipStats[r.ship].total+=r.ton;
    if(isHG) shipStats[r.ship].hg+=r.ton; else shipStats[r.ship].wc+=r.ton;
    if(r.isD) shipStats[r.ship].diesel+=r.ton;
    if(r.isG) shipStats[r.ship].gas+=r.ton;
    if(r.isG&&r.oil.indexOf('92')>=0&&r.oil.indexOf('乙醇')<0) shipStats[r.ship].g92+=r.ton;
    if(r.isG&&r.oil.indexOf('95')>=0) shipStats[r.ship].g95+=r.ton;
    if(r.isG&&r.oil.indexOf('92')>=0&&r.oil.indexOf('乙醇')>=0) shipStats[r.ship].ge92+=r.ton;
    if(r.isG&&r.oil.indexOf('98')>=0) shipStats[r.ship].g98+=r.ton;
  });
  var shipKeys=Object.keys(shipStats).sort(function(a,b){return shipStats[b].total-shipStats[a].total;});

  var html='<div class="sg">';
  html+='<div class="sc"><div class="si si-b">📦</div><div><h3>'+total.toFixed(2)+'</h3><p>总出库(吨)</p></div></div>';
  html+='<div class="sc"><div class="si si-g">🔄</div><div><h3>'+hgTotal.toFixed(2)+'</h3><p>互供出库(吨)</p></div></div>';
  html+='<div class="sc"><div class="si si-r">📤</div><div><h3>'+wcTotal.toFixed(2)+'</h3><p>外采出库(吨)</p></div></div>';
  html+='<div class="sc"><div class="si si-p">📝</div><div><h3>'+rows.length+'</h3><p>记录数</p></div></div>';
  html+='</div>';

  // 各油库统计（含互供/外采区分）
  html+='<div class="cd"><div class="cd-h"><b class="cd-t">🏭 各油库出库明细</b><span style="font-size:.82rem;color:#888;">互供=内部调拨+移库 / 外采=批发</span></div><div class="tc" style="padding:16px;"><table>';
  html+='<tr><th>油库</th><th>总出库(吨)</th><th>互供出库(吨)</th><th>外采出库(吨)</th><th>柴油(吨)</th><th>汽油(吨)</th><th>92#</th><th>95#</th><th>E92#</th><th>98#</th></tr>';
  shipKeys.forEach(function(sk){
    var s=shipStats[sk];
    html+='<tr><td><b>'+sk+'</b></td><td>'+s.total.toFixed(2)+'</td><td style="background:#f6ffed;">'+(s.hg||0).toFixed(2)+'</td><td style="background:#fff1f0;">'+(s.wc||0).toFixed(2)+'</td><td>'+(s.diesel||0).toFixed(2)+'</td><td>'+(s.gas||0).toFixed(2)+'</td><td>'+(s.g92||0).toFixed(2)+'</td><td>'+(s.g95||0).toFixed(2)+'</td><td>'+(s.ge92||0).toFixed(2)+'</td><td>'+(s.g98||0).toFixed(2)+'</td></tr>';
  });
  html+='<tr style="background:#f6ffed;"><td><b>合计</b></td><td><b>'+total.toFixed(2)+'</b></td><td><b>'+hgTotal.toFixed(2)+'</b></td><td><b>'+wcTotal.toFixed(2)+'</b></td><td><b>'+diesel.toFixed(2)+'</b></td><td><b>'+gas.toFixed(2)+'</b></td><td><b>'+g92.toFixed(2)+'</b></td><td><b>'+g95.toFixed(2)+'</b></td><td><b>'+ge92.toFixed(2)+'</b></td><td><b>'+g98.toFixed(2)+'</b></td></tr>';
  html+='</table></div></div>';

  // 汽油细分
  if(gas>0){
    html+='<div class="cd"><div class="cd-h"><b class="cd-t">⛽ 汽油品种细分</b></div><div class="tc" style="padding:16px;"><table>';
    html+='<tr><th>油品</th><th>出库量(吨)</th><th>占比</th></tr>';
    [['92#汽油',g92],['95#汽油',g95],['E92#汽油',ge92],['98#汽油',g98]].forEach(function(item){
      var pct=gas>0?(item[1]/gas*100).toFixed(1):'0.0';
      html+='<tr><td>'+item[0]+'</td><td><b>'+item[1].toFixed(2)+'</b></td><td>'+pct+'%</td></tr>';
    });
    html+='</table></div></div>';
  }

  // 油库柱状图
  if(shipKeys.length>0){
    html+='<div class="cd"><div class="cd-h"><b class="cd-t">📊 各油库出库对比</b></div><div style="padding:0 20px 20px;"><canvas id="exShipChart" width="800" height="350"></canvas></div></div>';
  }
  // 绘制图表
  setTimeout(function(){
    var canvas=document.getElementById('exShipChart');
    if(!canvas)return;
    var ctx=canvas.getContext('2d');
    var W=800,H=340,padL=60,padR=20,padT=30,padB=60;
    var cw=W-padL-padR,ch=H-padT-padB;
    ctx.clearRect(0,0,W,H);
    var max=0;
    shipKeys.forEach(function(k){var s=shipStats[k];if(s.total>max)max=s.total;});
    if(max===0)return;
    max=Math.ceil(max/20)*20+20;
    ctx.strokeStyle='#eee';ctx.lineWidth=1;
    ctx.font='11px sans-serif';ctx.fillStyle='#888';ctx.textAlign='right';
    for(var v=0;v<=max;v+=max/4){
      var y=padT+ch-(v/max)*ch;
      ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
      ctx.fillText(Math.round(v),padL-6,y+4);
    }
    var n=shipKeys.length,bw=Math.min(16,(cw-20)/n/2);
    var gap=Math.max(2,(cw-n*bw*2)/(n+1));
    ctx.textAlign='center';
    for(var i=0;i<n;i++){
      var x=padL+gap+i*(bw*2+gap);
      var s=shipStats[shipKeys[i]];
      var hg=s.hg||0,wc=s.wc||0;
      var hh=(hg/max)*ch,hw=(wc/max)*ch;
      ctx.fillStyle='#52c41a';ctx.fillRect(x,padT+ch-hh,bw,hh);
      ctx.fillStyle='#f5222d';ctx.fillRect(x+bw,padT+ch-hw,bw,hw);
      var nm=shipKeys[i].replace('油库','').replace('石化','');
      if(nm.length>5)nm=nm.substring(0,4)+'..';
      ctx.fillStyle='#333';ctx.font='9px sans-serif';ctx.fillText(nm,x+bw,padT+ch+14);
      if(hg>0){ctx.fillStyle='#52c41a';ctx.font='bold 8px sans-serif';ctx.fillText(hg.toFixed(0),x+bw/2,padT+ch-hh-2);}
      if(wc>0){ctx.fillStyle='#f5222d';ctx.font='bold 8px sans-serif';ctx.fillText(wc.toFixed(0),x+bw*1.5,padT+ch-hw-2);}
    }
    ctx.font='11px sans-serif';ctx.textAlign='left';
    ctx.fillStyle='#52c41a';ctx.fillRect(padL+10,padT-22,12,12);ctx.fill();
    ctx.fillStyle='#333';ctx.fillText('互供出库',padL+28,padT-12);
    ctx.fillStyle='#f5222d';ctx.fillRect(padL+110,padT-22,12,12);ctx.fill();
    ctx.fillStyle='#333';ctx.fillText('外采出库',padL+128,padT-12);
  },60);

  return html;
}

function handlePartnerExcel(input){

function handleExportCSV(input){
  if(!input.files||!input.files[0])return;
  var f=input.files[0];
  msg('i','解析中：'+f.name);
  var rd=new FileReader();
  rd.onload=function(e){
    try{
      var buf=e.target.result;var txt;
      var view=new Uint8Array(buf);
      if(view[0]===0xFF&&view[1]===0xFE) txt=new TextDecoder('utf-16le').decode(buf);
      else txt=new TextDecoder('gbk').decode(buf);
      var lines=txt.split('\n').filter(function(x){return x.trim();});
      if(lines.length<2){msg('w','no data');return;}
      var header=lines[0].split('\t').map(function(x){return x.trim();});
      var idxSite=header.indexOf('提货单位');
      var idxOil=header.indexOf('油品名称');
      var idxTon=header.indexOf('实际记账量(吨)');
      if(idxSite<0||idxTon<0){msg('e','no key cols');return;}
      var companies=S.get('partner_companies',[]);
      var companyNames=companies.map(function(c){return c.name;});
      var stats={};var unmatched=[];var ta={total:0,diesel:0,gas:0,g92:0,g95:0,e92:0,g98:0};
      for(var i=1;i<lines.length;i++){
        var cols=lines[i].split('\t');if(cols.length<=idxSite)continue;
        var site=(cols[idxSite]||'').replace(/^=/,'').replace(/\"/g,'').trim();
        var oil=(cols[idxOil]||'').trim();
        var ton=parseFloat(cols[idxTon])||0;if(ton<=0)continue;
        var isD=oil.indexOf('柴油')>=0;
        var isG=!isD&&(oil.indexOf('92')>=0||oil.indexOf('95')>=0||oil.indexOf('98')>=0);
        ta.total+=ton;if(isD)ta.diesel+=ton;if(isG)ta.gas+=ton;
        if(isG&&oil.indexOf('92')>=0&&oil.indexOf('乙醇')<0)ta.g92+=ton;
        if(isG&&oil.indexOf('95')>=0)ta.g95+=ton;
        if(isG&&oil.indexOf('92')>=0&&oil.indexOf('乙醇')>=0)ta.e92+=ton;
        if(isG&&oil.indexOf('98')>=0)ta.g98+=ton;
        var mc=null;for(var j=0;j<companyNames.length;j++){if(site.indexOf(companyNames[j])>=0){mc=companyNames[j];break;}}
        if(mc){
          if(!stats[mc])stats[mc]={total:0,diesel:0,gas:0,g92:0,g95:0,e92:0,g98:0};
          stats[mc].total+=ton;if(isD)stats[mc].diesel+=ton;if(isG)stats[mc].gas+=ton;
        }else unmatched.push({site:site,oil:oil,ton:ton});
      }
      S.set('partner_stats',{stats:stats,totalAll:ta,unmatched:unmatched});
      msg('s','OK '+Object.keys(stats).length+'家、'+unmatched.length+'未匹配');
      if(curPage==='outbound') rotab(null,curRoIdx);
    }catch(er){msg('e',er.message);}
  };rd.readAsArrayBuffer(f);
}

// ===== 批发&参控股分析（Tab 2） =====
function handleWholesaleCSV(input){
  if(!input.files||!input.files[0])return;
  var f=input.files[0];
  msg('i','解析中：'+f.name);
  var rd=new FileReader();
  rd.onload=function(e){
    try{
      var buf=e.target.result;var view=new Uint8Array(buf);var txt;
      if(view[0]===0xFF&&view[1]===0xFE) txt=new TextDecoder('utf-16le').decode(buf);
      else txt=new TextDecoder('gbk').decode(buf);
      var lines=txt.split('\n').filter(function(x){return x.trim();});
      if(lines.length<2){msg('w','no data');return;}
      var h=lines[0].split('\t').map(function(x){return x.trim();});
      var ot=h.indexOf('出库类型'),pk=h.indexOf('提货方式');
      var bt=h.indexOf('业务时间'),dp=h.indexOf('编制单位');
      var si=h.indexOf('提货单位'),oi=h.indexOf('油品名称'),tn=h.indexOf('实际记账量(吨)');
      if(tn<0||ot<0){msg('e','no key cols');return;}
      var md='',xd='',ar=[];
      for(var i=1;i<lines.length;i++){
        var c=lines[i].split('\t');if(c.length<=ot)continue;
        var o=(c[ot]||'').replace(/^=/,'').replace(/\"/g,'').trim();
        if(o!=='批发')continue;
        var t=parseFloat(c[tn])||0;if(t<=0)continue;
        var d=(c[bt]||'').replace(/^=/,'').replace(/\"/g,'').substring(0,10);
        if(d&&(!md||d<md))md=d;if(d&&(!xd||d>xd))xd=d;
        ar.push({date:d,dept:(c[dp]||'').replace(/^=/,'').replace(/\"/g,'').trim(),site:(c[si]||'').replace(/^=/,'').replace(/\"/g,'').trim(),oil:(c[oi]||'').replace(/^=/,'').replace(/\"/g,'').trim(),ton:t,pickup:(c[pk]||'').replace(/^=/,'').replace(/\"/g,'').trim(),isD:((c[oi]||'').indexOf('柴油')>=0)});
      }
      S.set('wholesale_data',{records:ar,minDate:md,maxDate:xd,filterFrom:md,filterTo:xd});
      msg('s','OK '+ar.length+'条（'+md+' ~ '+xd+'）');
      if(curPage==='outbound') rotab(null,2);
    }catch(er){msg('e',er.message);}
  };rd.readAsArrayBuffer(f);
}

var _DB={
  _db:null,_r:false,_q:[],_fallback:{},
  open:function(cb){
    var r=indexedDB.open('FuelStationDB',1);
    r.onupgradeneeded=function(e){var d=e.target.result;if(!d.objectStoreNames.contains('uploads'))d.createObjectStore('uploads',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('distMap'))d.createObjectStore('distMap');};
    r.onsuccess=function(e){_DB._db=e.target.result;_DB._r=true;_DB.flush();if(cb)cb()};
    r.onerror=function(e){console.error('DB error',e);_DB._r=true;_DB.flush();if(cb)cb()};
  },
  flush:function(){_DB._q.forEach(function(f){try{f()}catch(e){console.error('DB callback err',e)}});_DB._q=[]},
  _ok:function(fn){
    if(_DB._db&&typeof _DB._db.transaction==='function'){try{fn()}catch(e){console.error('DB op err',e)}}
    else if(_DB._r&&!_DB._db){console.warn('DB unavailable, using fallback');try{fn()}catch(e){console.error('fallback err',e)}}
    else{_DB._q.push(fn)}
  },
  getAll:function(st,cb){_DB._ok(function(){try{var t=_DB._db.transaction(st,'readonly').objectStore(st);var r=t.getAll();r.onsuccess=function(){cb(r.result)};r.onerror=function(){cb([])}}catch(e){cb([])}})},
  get:function(st,key,cb){_DB._ok(function(){try{var t=_DB._db.transaction(st,'readonly').objectStore(st);var r=t.get(key);r.onsuccess=function(){cb(r.result)};r.onerror=function(){cb(null)}}catch(e){cb(null)}})},
  put:function(st,val,cb){_DB._ok(function(){try{var t=_DB._db.transaction(st,'readwrite').objectStore(st);var r=t.put(val);r.onsuccess=function(){if(cb)cb(r.result)};r.onerror=function(e){console.error('put err',e);if(cb)cb(null)}}catch(e){if(cb)cb(null)}})},
  del:function(st,id,cb){_DB._ok(function(){try{var r=_DB._db.transaction(st,'readwrite').objectStore(st).delete(id);r.onsuccess=function(){if(cb)cb()};r.onerror=function(){if(cb)cb()}}catch(e){if(cb)cb()}})},
  clear:function(st,cb){_DB._ok(function(){try{var r=_DB._db.transaction(st,'readwrite').objectStore(st).clear();r.onsuccess=function(){if(cb)cb()};r.onerror=function(){if(cb)cb()}}catch(e){if(cb)cb()}})}
};

  ]},

function findIdx(hdr,names){for(var i=0;i<hdr.length;i++){for(var n=0;n<names.length;n++){if(String(hdr[i]).indexOf(names[n])>=0)return i}}return -1}

// 自动识别数据类型
function autoDetectType(hdr,fname){
  var allHdr=(hdr||[]).join(' ')+' '+(fname||'');
  // 配送计划: 有车辆+配送+出库
  if(/车辆|车牌/.test(allHdr)&&/配送|计划/.test(allHdr)&&/出库/.test(allHdr))return 'out_delivery';
  // 油库出库: 有实际记账量/出库类型+发货单位
  if((/实际记账量/.test(allHdr)||/出库类型/.test(allHdr))&&(/发货单位/.test(allHdr)||/提油机构/.test(allHdr)))return 'out_depot';
  // 运距: 有运距+提油+收油/加油站
  if(/运距|距离|公里/.test(allHdr)&&(/提油/.test(allHdr)||/加油站/.test(allHdr)||/收油/.test(allHdr)))return 'base_dist';
  // 吨油费用: 有吨油费用
  if(/吨油费用|单车费用|元\/吨/.test(allHdr))return 'base_cost';
  // 油库位置: 有油库+经纬度/地址
  if(/油库/.test(allHdr)&&(/经度|纬度|地址|经纬/.test(allHdr)||/position|location/i.test(allHdr)))return 'base_depot';
  // 油站位置: 有加油站+地址/区域
  if(/加油站/.test(allHdr)&&(/地址|区域|地区/.test(allHdr)))return 'base_station';
  return null;
}

function getCatById(id){
  for(var c in DB_CATS){var items=DB_CATS[c].items;for(var i=0;i<items.length;i++){if(items[i].id===id)return{cat:c,item:items[i]}}}
  return null;
}

function parseFile(file,cb){
  var name=file.name.toLowerCase(),isExcel=name.indexOf('.xls')>=0;
  var rd=new FileReader();
  rd.onload=function(e){
    try{
      var buf=e.target.result;
      if(isExcel){
        // Excel文件：使用Web Worker异步解析，不阻塞主线程
        try{
          var worker=new Worker('js/xlsx-worker.js');
          worker.onmessage=function(we){
            var res=we.data;
            worker.terminate();
            if(!res.success){msg('e','Excel解析失败：'+res.error);return}
            var data=res.data;
            if(!data||data.length<2){msg('w','Excel无数据');return}
            // 找表头行
            var h=-1;for(var si=0;si<Math.min(15,data.length);si++){
              var row=Array.isArray(data[si])?data[si].map(function(x){return String(x).trim()}):[];
              if(row.some(function(c){return c.indexOf('配送日期')>=0||c.indexOf('出库验收单号')>=0||c.indexOf('出库类型')>=0||c.indexOf('业务类型')>=0||c.indexOf('计划状态')>=0||c.indexOf('提油机构')>=0||c.indexOf('运距')>=0})){h=si;break}
            }
            if(h<0)h=0;
            var hdr=Array.isArray(data[h])?data[h].map(function(x){return String(x).trim()}):[];
            var rows=[];
            for(var ri=h+1;ri<data.length;ri++){
              var vals=Array.isArray(data[ri])?data[ri].map(function(x){return String(x).trim()}):[];
              if(vals.length>1&&vals.some(function(v){return v}))rows.push(vals.join('\t'))
            }
            cb({hdr:hdr,rows:rows,delim:'\t'})
          };
          worker.onerror=function(we){
            worker.terminate();
            msg('e','Worker加载失败，尝试同步解析');
            // 回退到同步解析
            try{var wb=XLSX.read(buf,{type:'array',cellDates:false});var ws=wb.Sheets[wb.SheetNames[0]];var data=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});processExcelData(data,cb)}catch(xe){msg('e','Excel解析失败：'+xe.message)}
          };
          // 把ArrayBuffer传给Worker（使用Transferable）
          worker.postMessage({buf:buf,fileName:file.name},[buf]);
          return;
        }catch(we){
          // Worker不可用，回退同步解析
          try{var wb=XLSX.read(buf,{type:'array',cellDates:false});var ws=wb.Sheets[wb.SheetNames[0]];var data=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});processExcelData(data,cb)}catch(xe){msg('e','Excel解析失败：'+xe.message)}
          return;
        }
      }
      // CSV文件：保持同步解析（CSV体积小速度快）
      var v=new Uint8Array(buf),txt;
      if(v[0]===0xFF&&v[1]===0xFE) txt=new TextDecoder('utf-16le').decode(buf);
      else if(v[0]===0xEF&&v[1]===0xBB&&v[2]===0xBF) txt=new TextDecoder('utf-8').decode(buf);
      else txt=new TextDecoder('gbk').decode(buf);
      var al=txt.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
      while(al.length&&!al[al.length-1].trim())al.pop();
      var delim=',';var cc=0,tc=0;
      for(var si=0;si<Math.min(10,al.length);si++){var t1=al[si].split(',').length,t2=al[si].split('\t').length;if(t1>cc)cc=t1;if(t2>tc)tc=t2}
      if(tc>cc)delim='\t';
      var h=-1;for(var si=0;si<Math.min(15,al.length);si++){var p=al[si].split(delim).map(function(x){return x.trim()});if(p.indexOf('配送日期')>=0||p.indexOf('出库验收单号')>=0||p.indexOf('出库类型')>=0||p.indexOf('业务类型')>=0||p.indexOf('计划状态')>=0||p.indexOf('提油机构')>=0||p.indexOf('运距')>=0){h=si;break}}
      if(h<0){msg('e','未找到数据表头');return}
      var hdr=al[h].split(delim).map(function(x){return x.trim()});var rows=[];for(var ri=h+1;ri<al.length;ri++){if(al[ri].trim())rows.push(al[ri])}
      if(rows.length<1){msg('w','文件无有效数据');return}
      cb({hdr:hdr,rows:rows,delim:delim});
    }catch(er){msg('e','解析失败：'+er.message)}
  };rd.readAsArrayBuffer(file);
}
// 辅助函数：处理Worker返回的Excel数据（找表头、构建行）
function processExcelData(data,cb){
  if(!data||data.length<2){msg('w','Excel无数据');return}
  var h=-1;for(var si=0;si<Math.min(15,data.length);si++){
    var row=Array.isArray(data[si])?data[si].map(function(x){return String(x).trim()}):[];
    if(row.some(function(c){return c.indexOf('配送日期')>=0||c.indexOf('出库验收单号')>=0||c.indexOf('出库类型')>=0||c.indexOf('业务类型')>=0||c.indexOf('计划状态')>=0||c.indexOf('提油机构')>=0||c.indexOf('运距')>=0})){h=si;break}
  }
  if(h<0)h=0;
  var hdr=Array.isArray(data[h])?data[h].map(function(x){return String(x).trim()}):[];
  var rows=[];for(var ri=h+1;ri<data.length;ri++){var vals=Array.isArray(data[ri])?data[ri].map(function(x){return String(x).trim()}):[];if(vals.length>1&&vals.some(function(v){return v}))rows.push(vals.join('\t'))}
  cb({hdr:hdr,rows:rows,delim:'\t'})
}

    if(idxStation<0)idxStation=findIdx(hdr,['加油站名','加油站名称']);
    _DB.get('distMap','data',function(existing){
      var dm=existing||{},cnt=0;
      if(idxP>=0&&idxR>=0&&idxD>=0){
        for(var ri=0;ri<res.rows.length;ri++){var c=res.rows[ri].split(delim);if(c.length<=Math.max(idxP,idxR,idxD))continue;var pu=(c[idxP]||'').trim(),re=(c[idxR]||'').trim(),di=parseFloat(String(c[idxD]).replace(/[^0-9.\-]/g,''));if(pu&&re&&di>0){dm[pu+'||'+re]=di;cnt++}}
      }else if(idxStation>=0){
        var depCols=[];for(var ci=3;ci<hdr.length;ci++){var hn=(hdr[ci]||'').trim();if(hn&&hn.indexOf('序号')<0&&hn.indexOf('地区')<0&&hn.indexOf('加油站')<0&&hn.indexOf('站点')<0)depCols.push(ci)}
        for(var ri=0;ri<res.rows.length;ri++){var c=res.rows[ri].split(delim);if(c.length<=idxStation)continue;var station=(c[idxStation]||'').trim();if(!station)continue;for(var di=0;di<depCols.length;di++){var ci2=depCols[di],depot=(hdr[ci2]||'').trim(),dist=parseFloat(String(c[ci2]||'').replace(/[^0-9.\-]/g,''));if(depot&&dist>0){dm[depot+'||'+station]=dist;cnt++}}}
      }
      if(!cnt){msg('e','未解析到有效运距数据');return}
      _DB._ok(function(){_DB._db.transaction('distMap','readwrite').objectStore('distMap').put(dm,'data')});
      Sync.pushDebounced();
      msg('s','✅ 运距映射已更新：'+cnt+' 条');

    var idxBiz=findIdx(hdr,['业务类型']),idxStatus=findIdx(hdr,['计划状态']);
    var idxBranch=findIdx(hdr,['分公司']),idxPickup=findIdx(hdr,['提油机构']),idxOil=findIdx(hdr,['油品名称']);
    var idxOutT=findIdx(hdr,['出库(吨)','出库']),idxPlan=findIdx(hdr,['计划(吨)','计划']);
    var idxVehicle=findIdx(hdr,['车辆']),idxFleet=findIdx(hdr,['车队']),idxReceive=findIdx(hdr,['收油机构']);
    var idxDist=findIdx(hdr,['运距','距离']),idxCang=findIdx(hdr,['车仓','仓位']);
    if(idxDate<0||idxBiz<0||idxStatus<0||idxOutT<0){msg('e','无法找到关键列');return}
    var recs=[];
    for(var ri=0;ri<res.rows.length;ri++){
      var c=res.rows[ri].split(delim);if(c.length<=Math.max(idxDate,idxStatus,idxOutT))continue;
      var st=(c[idxStatus]||'').replace(/^=/,'').replace(/"/g,'').trim();
      if(st!=='复核通过'&&st!=='已下发')continue;
      var biz=(c[idxBiz]||'').replace(/^=/,'').replace(/"/g,'').trim();
      if(biz.indexOf('内部配送')<0)continue;
      var veh=(c[idxVehicle]||'').replace(/^=/,'').replace(/"/g,'').trim();
      var vehOk=/^[京津沪渝冀豫云辽黑湘皖鲁新苏浙赣鄂桂甘晋蒙陕吉闽贵粤川青藏琼宁][A-Z][A-Z0-9]{4,6}$/.test(veh);
      if(!vehOk)continue;

      var cang=idxCang>=0?parseInt(c[idxCang])||0:0;
      var ds=(c[idxDate]||'').replace(/^=/,'').replace(/"/g,'').trim();
      var dm2=ds.match(/(\d{4})[-\/\.](\d{1,2})[-\/\.](\d{1,2})/);
      var date=dm2?dm2[1]+'-'+String(+dm2[2]).padStart(2,'0')+'-'+String(+dm2[3]).padStart(2,'0'):ds.substring(0,10).replace(/\//g,'-');
      recs.push({date:date,branch:(c[idxBranch]||'').trim(),biz:biz,pickup:(c[idxPickup]||'').trim(),receive:(c[idxReceive]||'').trim(),oil:(c[idxOil]||'').trim(),qty:qty,plan:plan,vehicle:veh,fleet:(c[idxFleet]||'').trim(),dist:dist,cang:cang,_src:fname});
    }

  }
  if(typeId==='out_depot'){
    var idxDate=findIdx(hdr,['配送日期','日期']);
    var idxBiz=findIdx(hdr,['业务类型','出库类型']);
    var idxBranch=findIdx(hdr,['分公司','编制单位']),idxShip=findIdx(hdr,['发货单位','提油机构']),idxSite=findIdx(hdr,['提货单位','收油机构']);
    var idxOil=findIdx(hdr,['油品名称']),idxTon=findIdx(hdr,['实际记账量(吨)','出库(吨)','出库']);
    var idxOutType=findIdx(hdr,['出库类型','业务类型']),idxPickup=findIdx(hdr,['提货方式']);
    if(idxTon<0||(idxShip<0&&idxSite<0)){msg('e','缺少关键列');return}
    var recs=[];

      var ton=parseFloat(c[idxTon])||0;if(ton<=0)continue;

  }

    for(var ri=0;ri<res.rows.length;ri++){
      var c=res.rows[ri].split(delim);

      depAgg[dp].fri+=fri;depAgg[dp].save+=save;depAgg[dp].qty+=qty;depAgg[dp].cnt++;
      if(!oilAgg[oil])oilAgg[oil]={fri:0,save:0,qty:0,cnt:0};
      oilAgg[oil].fri+=fri;oilAgg[oil].save+=save;oilAgg[oil].qty+=qty;oilAgg[oil].cnt++;
    });
    html+='<div class="sg">'+
      '<div class="sc"><div class="si si-b">📋</div><div><h3>'+totalRows+'</h3><p>总记录数</p></div></div>'+
      '<div class="sc"><div class="si si-g">⛽</div><div><h3>'+totalQty.toFixed(1)+'</h3><p>总出库量(吨)</p></div></div>'+
      '<div class="sc"><div class="si si-o">🚚</div><div><h3>'+totalFreight.toFixed(2)+'</h3><p>总运费(元)</p></div></div>'+
      '<div class="sc"><div class="si si-p">💰</div><div><h3 style="color:'+(totalSave>0?'#52c41a':'#888')+'">'+totalSave.toFixed(2)+'</h3><p>节约运费(元)</p></div></div>'+
    '</div>';
    // 按分公司
    var brKeys=Object.keys(brAgg).sort(function(a,b){return brAgg[b].save-brAgg[a].save});
    html+='<div class="cd"><div class="cd-h"><b>🏢 按分公司节约统计</b></div><div class="tc" style="padding:12px 16px;"><table><tr><th>分公司</th><th>记录数</th><th>出库量(吨)</th><th>运费(元)</th><th>节约(元)</th><th>节约/吨</th></tr>';
    brKeys.forEach(function(k){
      var s=brAgg[k];
      html+='<tr><td><b>'+k+'</b></td><td>'+s.cnt+'</td><td>'+s.qty.toFixed(1)+'</td><td>'+s.fri.toFixed(2)+'</td><td style="color:#52c41a;font-weight:600">'+s.save.toFixed(2)+'</td><td>'+(s.qty>0?(s.save/s.qty).toFixed(2):'0')+'</td></tr>'
    });
    html+='</table></div></div>';
    // 按油库
    var dpKeys=Object.keys(depAgg).sort(function(a,b){return depAgg[b].save-depAgg[a].save});
    html+='<div class="cd"><div class="cd-h"><b>🏭 按油库节约统计</b></div><div class="tc" style="padding:12px 16px;"><table><tr><th>油库</th><th>记录数</th><th>出库量(吨)</th><th>运费(元)</th><th>节约(元)</th></tr>';
    dpKeys.forEach(function(k){
      var s=depAgg[k];
      html+='<tr><td><b>'+k+'</b></td><td>'+s.cnt+'</td><td>'+s.qty.toFixed(1)+'</td><td>'+s.fri.toFixed(2)+'</td><td style="color:#52c41a;font-weight:600">'+s.save.toFixed(2)+'</td></tr>'
    });
    html+='</table></div></div>';
    // 明细表（前200条）
    html+='<div class="cd"><div class="cd-h"><b>📋 订单明细</b><span style="font-size:.82rem;color:#888">显示前200条，共'+totalRows+'条</span></div><div class="tc" style="padding:12px 16px;max-height:300px;overflow-y:auto"><table><tr><th>日期</th><th>油品</th><th>提货单位</th><th>油库</th><th>吨数</th><th>费率</th><th>运费(元)</th><th>车号</th><th>分公司</th><th>类型</th><th>节约</th></tr>';
    all.slice(0,200).forEach(function(r){
      html+='<tr><td style="font-size:.8rem">'+(String(r[1]||'').substring(0,10))+'</td><td>'+(r[2]||'')+'</td><td>'+(r[3]||'')+'</td><td>'+(r[4]||'')+'</td><td>'+(r[6]||'')+'</td><td>'+(r[7]||'')+'</td><td>'+(r[8]||'')+'</td><td>'+(r[11]||'')+'</td><td><b>'+(r[12]||'')+'</b></td><td>'+(r[13]||'')+'</td><td style="color:#52c41a;font-weight:600">'+(parseFloat(r[17])||0).toFixed(2)+'</td></tr>'
    });
    html+='</table></div></div>';
    // 上传记录
    if(pool.length>1){
      html+='<div class="cd"><div class="cd-h"><b>📁 上传记录</b></div><div class="tc" style="padding:12px 16px;"><table><tr><th>文件</th><th>条数</th><th>上传时间</th><th>操作</th></tr>';
      pool.forEach(function(u){
        html+='<tr><td>'+(u.fileName||'')+'</td><td>'+(u.records?u.records.length:0)+'</td><td style="color:#888">'+(u.createdAt?u.createdAt.slice(0,10):'')+'</td><td><button class="btn btn-d btn-sm" onclick="delUp('+u.id+');go(\'savings\')">✕</button></td></tr>'
      });
      html+='</table></div></div>'
    }
    c.innerHTML=html
  })
}
function upSavings(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.csv,.xlsx,.xls';
  inp.onchange=function(){
    if(!inp.files||!inp.files[0])return;
    var f=inp.files[0];msg('i','解析中：'+f.name);
    parseFile(f,function(res){
      try{
        var hdr=res.hdr,delim=res.delim;
        // 按列名匹配：结算月份/日期/油品/提货单位/油库/提油单号/出库吨数/费率/运费合计/运距/总运距/车号/分公司/类型
        var idx0=findIdx(hdr,['结算月份','月份','月']),idx1=findIdx(hdr,['日期','业务时间','配送日期']);
        var idx2=findIdx(hdr,['油品','品名','品种']),idx3=findIdx(hdr,['提货单位','收货单位','加油站']),idx4=findIdx(hdr,['油库','发货单位']);
        var idx5=findIdx(hdr,['提油单号','单据号','单号']),idx6=findIdx(hdr,['出库吨数','吨数','出库量','数量']);
        var idx7=findIdx(hdr,['费率','单价']),idx8=findIdx(hdr,['运费合计','运费','金额','总运费']);
        var idx9=findIdx(hdr,['运距','距离']),idx11=findIdx(hdr,['车号','车牌','车辆']);
        var idx12=findIdx(hdr,['分公司','编制单位']),idx13=findIdx(hdr,['类型','费用类型','类别']);
        var idx17=findIdx(hdr,['运费','节约']); // 可能最后一列的运费是节约值
        if(idx8<0&&idx3<0){msg('e','缺少"运费合计"或"提货单位"列');return}
        var recs=[];
        for(var ri=0;ri<res.rows.length;ri++){
          var c=res.rows[ri].split(delim);if(c.length<=Math.max(idx8||0,idx3||0))continue;
          // 如果第一列不是月份数字则跳过（表头行过滤）
          if(idx0>=0&&(c[idx0]||'').trim().indexOf('月')<0&&isNaN(parseFloat(c[idx0])))continue;
          var row=[];for(var ci=0;ci<18;ci++)row[ci]=c[ci]||'';
          recs.push(row);
        }
        if(!recs.length){msg('w','无有效数据');return}
        var fname=f.name;
        var _recS={type:'savings_data',cat:'savings',fileName:fname,records:recs,modules:['互供运费节约'],recordCount:recs.length,createdAt:new Date().toISOString()};
        _DB.put('uploads',_recS);Sync.pushDebounced();
        msg('s','✅ 已上传 '+recs.length+' 条互供运费节约数据');
        go('savings');
      }catch(er){msg('e','解析失败：'+er.message)}
    });inp.value='';
  };inp.click();
}

// ===== 全局拖拽上传 =====
var appDragZone=document.getElementById('appDragZone');
var dragEnterCount=0;

document.addEventListener('dragenter',function(e){
  e.preventDefault();
  dragEnterCount++;
  if(dragEnterCount===1){
    appDragZone.classList.add('show');
  }
});

document.addEventListener('dragover',function(e){
  e.preventDefault();
  if(e.dataTransfer)e.dataTransfer.dropEffect='copy';
});

document.addEventListener('dragleave',function(e){
  e.preventDefault();
  dragEnterCount--;
  if(dragEnterCount<=0){
    dragEnterCount=0;
    appDragZone.classList.remove('show');
  }
});

document.addEventListener('drop',function(e){
  e.preventDefault();
  dragEnterCount=0;
  appDragZone.classList.remove('show');
  var files=e.dataTransfer.files;
  if(!files||!files.length)return;
  var f=files[0];
  if(!f.name.match(/\.(csv|xlsx?|xlsm)$/i)){
    msg('e','不支持的文件类型，请上传 CSV 或 Excel 文件');return;
  }
  showUploadFromDrop(f);
});

function showUploadFromDrop(f){
  var loadEl=document.createElement('div');
  loadEl.id='dbParseLoading';
  loadEl.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:99998;display:flex;align-items:center;justify-content:center';
  loadEl.innerHTML='<div style="background:#fff;border-radius:16px;padding:40px 48px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.15)">'+
    '<div style="width:48px;height:48px;margin:0 auto 16px;border:4px solid #E8E4DA;border-top-color:#3A5C4A;border-radius:50%;animation:spin 1s linear infinite"></div>'+
    '<style>@keyframes spin{to{transform:rotate(360deg)}}</style>'+
    '<div style="font-size:15px;color:#2C2A28;margin-bottom:6px;font-weight:500">解析文件中，请稍候...</div>'+
    '<div style="font-size:12px;color:#8A8878">'+f.name+'</div></div>';
  document.body.appendChild(loadEl);
  setTimeout(function(){
    try{
      parseFile(f,function(res){
        var le2=document.getElementById('dbParseLoading');
        if(le2)le2.remove();
        showUploadDialog(f,res);
      });
    }catch(er){
      var le3=document.getElementById('dbParseLoading');
      if(le3)le3.remove();
      msg('e','解析失败：'+er.message);
    }
  }, 100);
}

function showUploadDialog(f,res){
  try{
    var hdr=res.hdr;
    var detected=typeof autoDetectType==='function'?autoDetectType(hdr,f.name):'';
    var catSelHtml='<table style="width:100%;border-collapse:collapse;font-size:12px">'+
      '<tr style="background:#f5f7fa"><th style="padding:6px 8px;text-align:left;border-bottom:1px solid #e0e0e0;width:30%">数据大类</th><th style="padding:6px 8px;text-align:left;border-bottom:1px solid #e0e0e0;width:35%">数据小类</th><th style="padding:6px 8px;text-align:left;border-bottom:1px solid #e0e0e0;width:35%">说明</th></tr>';
    for(var c in window.DB_CATS||{}){
      var cat=DB_CATS[c];
      var items=cat.items;
      for(var i=0;i<items.length;i++){
        var it=items[i];
        var matched=it.id===detected;
        catSelHtml+='<tr onclick="selDbCat(\''+it.id+'\',this)" style="cursor:pointer;'+(matched?'background:#e6f7ff;':'')+'"'+(matched?' class="dbCatSel"':'')+'><td style="padding:5px 8px;border-bottom:1px solid #f0f0f0;'+(i===0?'font-weight:600;color:#1890ff;':'color:#999;font-size:11px')+'">'+(i===0?cat.label:'')+'</td>'+
          '<td style="padding:5px 8px;border-bottom:1px solid #f0f0f0;font-weight:'+(matched?'700':'400')+'"><span style="display:inline-flex;align-items:center;gap:4px"><input type="radio" name="dbCatRadio" value="'+it.id+'"'+(matched?' checked':'')+' style="width:14px;height:14px;accent-color:#1890ff;margin:0"> '+it.label+'</span></td>'+
          '<td style="padding:5px 8px;border-bottom:1px solid #f0f0f0;color:#888;font-size:11px">'+it.desc+'</td></tr>';
      }
    }
    catSelHtml+='</table>';
    var modHtml='';
    if(window.DB_MODULES){
      DB_MODULES.forEach(function(m){
        modHtml+='<label style="display:inline-flex;align-items:center;gap:4px;padding:4px 8px;margin:2px;font-size:11px;cursor:pointer;border:1px solid #e0e0e0;border-radius:4px;background:#fafafa"><input type="checkbox" checked value="'+m+'" style="width:12px;height:12px;accent-color:#1890ff;cursor:pointer"> '+m+'</label>'
      });
    }
    var dialogHtml='<div id="dbUpOverlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:9999;display:flex;align-items:center;justify-content:center" onclick="if(event.target===this)closeDbUp()">'+
      '<div style="background:#fff;border-radius:8px;padding:20px;max-width:520px;width:95%;max-height:80vh;overflow-y:auto">'+
      '<div style="font-size:14px;font-weight:600;margin-bottom:4px">📁 拖拽上传 - 保存到数据库</div>'+
      '<div style="font-size:11px;color:#888;margin-bottom:10px">📄 '+(detected?'<span style="color:#52c41a;font-weight:600">✅ 自动识别</span>  ':'<span style="color:#faad14">⚠️ 未自动识别，请手动选择</span>  ')+f.name+'</div>'+
      '<div style="margin-bottom:10px"><label style="font-size:12px;font-weight:600;color:#555;display:block;margin-bottom:4px">📂 数据类型</label>'+
      catSelHtml+'</div>'+
      '<div style="margin-bottom:6px"><label style="font-size:12px;font-weight:600;color:#555;display:block;margin-bottom:4px">🔗 引用模块</label><div style="display:flex;flex-wrap:wrap;gap:2px">'+modHtml+'</div></div>'+
      '<div style="text-align:center;margin-top:12px;display:flex;gap:8px;justify-content:center">'+
      '<span class="btn btn-p" onclick="confirmDbUpload(\''+f.name+'\')" style="padding:8px 24px">✅ 确认上传</span>'+
      '<span class="btn btn-o" onclick="closeDbUp()" style="padding:8px 14px">取消</span></div></div></div>';
    document.body.insertAdjacentHTML('beforeend',dialogHtml);
    window._pendingFile=f;
    window._pendingRes=res;
  }catch(er){
    msg('e','上传对话框异常：'+er.message);
  }
}
