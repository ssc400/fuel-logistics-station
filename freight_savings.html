// ===== 高德API工具 =====
var AMAP_KEY = '';
function h(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function msg(type,text){
  var d=document.createElement('div');
  d.className='msg msg-'+type;
  d.textContent=text;
  document.body.appendChild(d);
  setTimeout(function(){d.remove()},3000);
}

// ===== Geo工具 =====
function toRad(d){return d*Math.PI/180}
function geoDist(lat1,lon1,lat2,lon2){
  var R=6371;
  var dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// 估算道路运距（直线×1.3）
function roadDist(lat1,lon1,lat2,lon2){
  return Math.round(geoDist(lat1,lon1,lat2,lon2)*1.3);
}

// ===== 油库分类函数 =====
function classifyDepot(n){
  if(!n)return '外采库';
  for(var i=0;i<DEPOT_CLASS.length;i++){for(var k=0;k<DEPOT_CLASS[i].k.length;k++){if(n.indexOf(DEPOT_CLASS[i].k[k])>=0)return DEPOT_CLASS[i].t;}}
  if(n.indexOf('石化')>=0)return '中石化互供库';
  if(n.indexOf('油库')>=0)return '自有库';
  return '外采库';
}

// ===== 查找加油站对应的自有库 =====
function findOwnDepot(siteName, destAddr){
  var text = (siteName + ' ' + (destAddr||'')).trim();
  // 先精确匹配城市
  for(var city in CITY_DEPOT_MAP){
    if(text.indexOf(city)>=0)return CITY_DEPOT_MAP[city];
  }
  // 模糊匹配：取地址中的第一个城市名
  for(var city in CITY_DEPOT_MAP){
    if(text.indexOf(city.substring(0,2))>=0)return CITY_DEPOT_MAP[city];
  }
  return null;
}

// ===== 获取油库坐标 =====
function getDepotCoord(name){
  if(OWN_DEPOTS[name])return OWN_DEPOTS[name];
  // 也查互供库
  if(SUPPLY_DEPOTS[name])return SUPPLY_DEPOTS[name];
  return null;
}

// ===== CSV解析 =====
function handleCSV(input){
  if(!input.files||!input.files[0])return;
  var f=input.files[0];
  msg('i','正在解析：'+f.name);
  var rd=new FileReader();
  rd.onload=function(e){
    try{
      var buf=e.target.result;
      var view=new Uint8Array(buf);
      var txt;
      if(view[0]===0xFF&&view[1]===0xFE) txt=new TextDecoder('utf-16le').decode(buf);
      else txt=new TextDecoder('gbk').decode(buf);
      var lines=txt.split('\n').filter(function(x){return x.trim();});
      if(lines.length<2){msg('w','文件无数据');return;}

      var header=lines[0].split('\t').map(function(x){return x.trim();});
      var idxDate=header.indexOf('业务时间');
      var idxDept=header.indexOf('编制单位');
      var idxShip=header.indexOf('发货单位');
      var idxSite=header.indexOf('提货单位');
      var idxDest=header.indexOf('到货地点');
      var idxOil=header.indexOf('油品名称');
      var idxTon=header.indexOf('实际记账量(吨)');
      var idxOutType=header.indexOf('出库类型');
      var idxPickup=header.indexOf('提货方式');

      if(idxShip<0||idxTon<0||idxOutType<0){msg('e','缺少关键列(发货单位/实际记账量/出库类型)');return;}

      var records=[];
      for(var i=1;i<lines.length;i++){
        var cols=lines[i].split('\t');
        if(cols.length<=idxTon)continue;
        var ton=parseFloat((cols[idxTon]||'').replace(/^=/,'').replace(/\"/g,''))||0;
        if(ton<=0)continue;

        var ship=(cols[idxShip]||'').replace(/^=/,'').replace(/\"/g,'').trim();
        var site=(cols[idxSite]||'').replace(/^=/,'').replace(/\"/g,'').trim();
        var dest=(cols[idxDest]||'').replace(/^=/,'').replace(/\"/g,'').trim();
        var oil=(cols[idxOil]||'').replace(/^=/,'').replace(/\"/g,'').trim();
        var outType=(cols[idxOutType]||'').replace(/^=/,'').replace(/\"/g,'').trim();
        var date=(cols[idxDate]||'').replace(/^=/,'').replace(/\"/g,'').trim().substring(0,10);
        var dept=(cols[idxDept]||'').replace(/^=/,'').replace(/\"/g,'').trim();
        var pickup=(cols[idxPickup]||'').replace(/^=/,'').replace(/\"/g,'').trim();

        var cat=classifyDepot(ship);
        var isMutualSupply = (cat==='中石化互供库'||cat==='中海油互供库') && (outType.indexOf('调拨')>=0||outType.indexOf('移库')>=0);

        records.push({
          date:date, dept:dept, ship:ship, site:site, dest:dest||site,
          oil:oil, ton:ton, outType:outType, pickup:pickup,
          cat:cat, isMutualSupply:isMutualSupply
        });
      }

      // 筛选日期范围
      var minDate='',maxDate='';
      records.forEach(function(r){
        if(r.date&&(!minDate||r.date<minDate))minDate=r.date;
        if(r.date&&(!maxDate||r.date>maxDate))maxDate=r.date;
      });

      data = {
        records:records, minDate:minDate, maxDate:maxDate,
        filterFrom:minDate, filterTo:maxDate,
        filterCat:'all', // all / 互供 / 非互供
        fileName:f.name
      };

      msg('s','解析完成！共 '+records.length+' 条记录，其中互供 '+
        records.filter(function(r){return r.isMutualSupply;}).length+' 条');
      render();
    }catch(er){msg('e','解析失败：'+er.message);}
  };
  rd.readAsArrayBuffer(f);
}

// ===== 筛选器 =====
function renderFilters(){
  if(!data||!data.records)return '';
  var html='<div class="cd"><div class="cd-h">'+
    '<span class="cd-t">🔍 筛选条件</span>'+
    '<span style="font-size:.82rem;color:#888;">共 '+data.records.length+' 条记录</span></div>'+
    '<div style="padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;">'+
    '<label>日期</label>'+
    '<input type="date" id="ff" value="'+data.filterFrom+'" onchange="applyFilter()">'+
    '<span>~</span>'+
    '<input type="date" id="ft" value="'+data.filterTo+'" onchange="applyFilter()">'+
    '<label>类型</label>'+
    '<select id="fc" onchange="applyFilter()">'+
      '<option value="all"'+(data.filterCat==='all'?' selected':'')+'>全部</option>'+
      '<option value="mutual"'+(data.filterCat==='mutual'?' selected':'')+'>仅互供记录</option>'+
      '<option value="self"'+(data.filterCat==='self'?' selected':'')+'>仅非互供</option>'+
    '</select>'+
    '<button class="btn btn-p btn-sm" onclick="applyFilter()">应用</button>'+
    '</div></div>';
  return html;
}

function applyFilter(){
  if(!data)return;
  data.filterFrom=document.getElementById('ff')?document.getElementById('ff').value:data.filterFrom;
  data.filterTo=document.getElementById('ft')?document.getElementById('ft').value:data.filterTo;
  data.filterCat=document.getElementById('fc')?document.getElementById('fc').value:data.filterCat;
  render();
}

// ===== 主分析逻辑 =====
function analyzeRecords(filteredRecords){
  var up=parseFloat(document.getElementById('unitPrice').value)||0.5;
  var rf=parseFloat(document.getElementById('roadFactor').value)||1.3;

  results = [];
  var mutualRecords = filteredRecords.filter(function(r){return r.isMutualSupply;});

  mutualRecords.forEach(function(r){
    // 获取互供库坐标
    var supplyCoord = getDepotCoord(r.ship);
    if(!supplyCoord)return; // 无法获取互供库坐标，跳过

    // 查找对应的自有库
    var ownMatch = findOwnDepot(r.site, r.dest);
    if(!ownMatch)return; // 找不到对应自有库

    var ownCoord = getDepotCoord(ownMatch.depot);
    if(!ownCoord)return;

    // 估算运距
    var actualDist = roadDist(supplyCoord.lat, supplyCoord.lon, supplyCoord.lat||0, supplyCoord.lon||0);
    // 对互供库坐标的修复：需要找加油站的坐标来算实际距离
    // 用目的地地址模糊估测

    // 但这里我们没有加油站坐标，只能用互供库到自有库的距离比例来做简化
    // 更准确的做法：用"加油站所在城市"的近似坐标

    // 获取加油站所在城市的近似坐标
    var siteCity = findOwnDepot(r.site, r.dest);
    var siteCoord = null;
    if(siteCity){
      // 用该城市对应的自有库坐标近似表示加油站位置
      var depotInfo = getDepotCoord(siteCity.depot);
      if(depotInfo) siteCoord = depotInfo;
    }

    var actualDistKm, ownDistKm;
    if(siteCoord){
      // 互供库到加油站的距离
      actualDistKm = roadDist(supplyCoord.lat, supplyCoord.lon, siteCoord.lat, siteCoord.lon);
      // 自有库到加油站的距离
      ownDistKm = roadDist(ownCoord.lat, ownCoord.lon, siteCoord.lat, siteCoord.lon);
    } else {
      // 无法获取加油站位置，用互供库到自有库距离的一半作为近似
      var depotDist = roadDist(supplyCoord.lat, supplyCoord.lon, ownCoord.lat, ownCoord.lon);
      actualDistKm = Math.round(depotDist * 0.6);
      ownDistKm = Math.round(depotDist * 0.4);
    }

    if(actualDistKm<=0||ownDistKm<=0)return;

    var actualCost = actualDistKm * r.ton * up;
    var ownCost = ownDistKm * r.ton * up;
    var savings = actualCost - ownCost;

    results.push({
      date:r.date, dept:r.dept, site:r.site, dest:r.dest,
      oil:r.oil, ton:r.ton,
      supplyDepot:r.ship, supplyDist:actualDistKm,
      ownDepot:ownMatch.depot, ownDist:ownDistKm,
      actualCost:Math.round(actualCost*100)/100,
      ownCost:Math.round(ownCost*100)/100,
      savings:Math.round(savings*100)/100,
      savingsPercent:savings!==0?Math.round(Math.abs(savings)/actualCost*100):0
    });
  });

  return results;
}

// ===== 渲染结果 =====
function renderResults(){
  if(!data||!data.records||!data.records.length)return '';

  var records = data.records;
  // 按筛选条件过滤
  var filtered = records.filter(function(r){
    if(data.filterFrom && r.date<data.filterFrom)return false;
    if(data.filterTo && r.date>data.filterTo)return false;
    if(data.filterCat==='mutual' && !r.isMutualSupply)return false;
    if(data.filterCat==='self' && r.isMutualSupply)return false;
    return true;
  });

  var html = '';
  // 统计卡片
  var totalMutual = filtered.filter(function(r){return r.isMutualSupply;});
  var totalTon = totalMutual.reduce(function(s,r){return s+r.ton;},0);

  // 运距分析
  var res = analyzeRecords(filtered);
  var analyzedRes = res;

  // 汇总统计
  var totalActualCost = analyzedRes.reduce(function(s,r){return s+r.actualCost;},0);
  var totalOwnCost = analyzedRes.reduce(function(s,r){return s+r.ownCost;},0);
  var totalSavings = analyzedRes.reduce(function(s,r){return s+r.savings;},0);
  var sumActualDist = analyzedRes.reduce(function(s,r){return s+r.supplyDist;},0);
  var sumOwnDist = analyzedRes.reduce(function(s,r){return s+r.ownDist;},0);
  var matchedTon = analyzedRes.reduce(function(s,r){return s+r.ton;},0);
  var unmatchedCount = totalMutual.length - analyzedRes.length;

  html += '<div class="sg">'+
    '<div class="sc"><div class="si si-b">🔄</div><div><h3>'+totalMutual.length+'</h3><p>互供记录数</p></div></div>'+
    '<div class="sc"><div class="si si-r">💰</div><div><h3>¥'+totalActualCost.toFixed(0)+'</h3><p>互供实际运费(元)</p></div></div>'+
    '<div class="sc"><div class="si si-g">🏭</div><div><h3>¥'+totalOwnCost.toFixed(0)+'</h3><p>自有库运费(元)</p></div></div>'+
    '<div class="sc"><div class="si '+(totalSavings>=0?'si-g':'si-r')+'">'+(totalSavings>=0?'📈':'📉')+'</div><div><h3>'+(totalSavings>=0?'+':'')+'¥'+totalSavings.toFixed(0)+'</h3><p>'+(totalSavings>=0?'节约运费':'增加运费')+'(元)</p></div></div>'+
  '</div>';

  if(unmatchedCount>0){
    html += '<div class="cd" style="background:#fffbe6;border:1px solid #ffe58f;">'+
      '<div style="padding:12px 20px;font-size:.85rem;color:#ad8b00">'+
        '⚠️ 有 <b>'+unmatchedCount+'</b> 条互供记录无法匹配自有库（可能因加油站名称无法识别所属城市）。'+
        '这些记录不会出现在运费计算中。'+
      '</div></div>';
  }

  // 运费节约分布图
  if(analyzedRes.length>0){
    var savingsData = {positive:0,negative:0};
    analyzedRes.forEach(function(r){
      if(r.savings>=0)savingsData.positive+=r.savings;
      else savingsData.negative+=Math.abs(r.savings);
    });

    html += '<div class="cd"><div class="cd-h"><span class="cd-t">📊 运费对比总览</span></div><div class="chart-row" style="padding:16px 20px;">'+
      '<div><canvas id="costChart" height="250"></canvas></div>'+
      '<div><canvas id="savingsChart" height="250"></canvas></div>'+
    '</div></div>';

    setTimeout(function(){
      // 运费对比图
      var c1=document.getElementById('costChart');
      if(c1&&window.Chart){
        new Chart(c1,{
          type:'bar',
          data:{
            labels:['互供库运费','自有库运费'],
            datasets:[{
              label:'运费(元)',
              data:[totalActualCost,totalOwnCost],
              backgroundColor:['#f5222d','#52c41a'],
              borderRadius:6
            }]
          },
          options:{
            responsive:true,maintainAspectRatio:true,
            plugins:{legend:{display:false}},
            scales:{y:{beginAtZero:true,title:{display:true,text:'元'}}}
          }
        });
      }
      // 节约/增加分布
      var c2=document.getElementById('savingsChart');
      if(c2&&window.Chart){
        new Chart(c2,{
          type:'doughnut',
          data:{
            labels:['节约运费(元)','增加运费(元)'],
            datasets:[{
              data:[savingsData.positive,savingsData.negative],
              backgroundColor:['#52c41a','#f5222d']
            }]
          },
          options:{
            responsive:true,maintainAspectRatio:true,
            plugins:{
              legend:{position:'bottom'},
              tooltip:{callbacks:{label:function(ctx){return ctx.label+': ¥'+ctx.parsed.toFixed(0);}}}
            }
          }
        });
      }
    }, 100);
  }

  // 详细表格
  html += '<div class="cd"><div class="cd-h">'+
    '<span class="cd-t">📋 互供运费节约明细</span>'+
    '<span style="font-size:.82rem;color:#888;">已匹配 '+analyzedRes.length+' 条</span></div>'+
    '<div class="tc" style="padding:12px 16px;"><table>'+
    '<tr>'+
      '<th>日期</th><th>加油站</th><th>油品</th><th>吨数</th>'+
      '<th>互供库</th><th>运距(km)</th>'+
      '<th>还原自有库</th><th>运距(km)</th>'+
      '<th>实际运费</th><th>自有运费</th><th>节约/增加</th>'+
    '</tr>';

  // 按节约金额从大到小排序
  analyzedRes.sort(function(a,b){return Math.abs(b.savings)-Math.abs(a.savings);});

  analyzedRes.forEach(function(r){
    var isSavings = r.savings>=0;
    html += '<tr>'+
      '<td>'+r.date+'</td>'+
      '<td><b>'+r.site+'</b></td>'+
      '<td>'+r.oil+'</td>'+
      '<td>'+r.ton.toFixed(2)+'</td>'+
      '<td><span class="tag tag-r">'+r.supplyDepot+'</span></td>'+
      '<td>'+r.supplyDist+'</td>'+
      '<td><span class="tag tag-g">'+r.ownDepot+'</span></td>'+
      '<td>'+r.ownDist+'</td>'+
      '<td>¥'+r.actualCost.toFixed(0)+'</td>'+
      '<td>¥'+r.ownCost.toFixed(0)+'</td>'+
      '<td style="font-weight:700;'+(isSavings?'color:#52c41a':'color:#f5222d')+'">'+
        (isSavings?'+':'')+'¥'+r.savings.toFixed(0)+' '+(isSavings?'⬆节约':'⬇增加')+
      '</td>'+
    '</tr>';
  });
  html += '</table></div></div>';

  // 按自有库汇总
  var depotSummary = {};
  analyzedRes.forEach(function(r){
    if(!depotSummary[r.ownDepot])depotSummary[r.ownDepot]={count:0,ton:0,savings:0};
    depotSummary[r.ownDepot].count++;
    depotSummary[r.ownDepot].ton+=r.ton;
    depotSummary[r.ownDepot].savings+=r.savings;
  });
  var depotKeys = Object.keys(depotSummary).sort(function(a,b){return depotSummary[b].savings-depotSummary[a].savings;});

  html += '<div class="cd"><div class="cd-h"><span class="cd-t">🏭 按自有库汇总</span></div><div class="tc" style="padding:12px 16px;"><table>'+
    '<tr><th>自有库</th><th>互供记录数</th><th>总吨数</th><th>运费节约(元)</th></tr>';
  depotKeys.forEach(function(dk){
    var s=depotSummary[dk];
    html += '<tr><td><b>'+dk+'</b></td><td>'+s.count+'</td><td>'+s.ton.toFixed(2)+'</td>'+
      '<td style="font-weight:700;color:'+(s.savings>=0?'#52c41a':'#f5222d')+'">'+(s.savings>=0?'+':'')+'¥'+s.savings.toFixed(0)+'</td></tr>';
  });
  html += '</table></div></div>';

  // 未匹配的互供记录（用于排查）
  var unmatchedMutual = totalMutual.filter(function(r){
    return !analyzedRes.some(function(ar){return ar.date===r.date&&ar.site===r.site&&ar.supplyDepot===r.ship&&ar.ton===r.ton;});
  });
  if(unmatchedMutual.length>0){
    html += '<div class="cd"><div class="cd-h"><span class="cd-t">⚠️ 未匹配的互供记录</span><span style="font-size:.82rem;color:#888;">'+unmatchedMutual.length+' 条</span></div><div class="tc" style="padding:12px 16px;">'+
      '<table><tr><th>日期</th><th>提货单位</th><th>油品</th><th>吨数</th><th>互供库</th><th>可能原因</th></tr>';
    unmatchedMutual.slice(0,50).forEach(function(r){
      var reason = '无法识别所属城市/自有库';
      html += '<tr><td>'+r.date+'</td><td>'+r.site+'</td><td>'+r.oil+'</td><td>'+r.ton.toFixed(2)+'</td><td>'+r.ship+'</td><td style="color:#faad14">'+reason+'</td></tr>';
    });
    if(unmatchedMutual.length>50)html += '<tr><td colspan="6" style="text-align:center;color:#888;">...还有 '+(unmatchedMutual.length-50)+' 条</td></tr>';
    html += '</table></div></div>';
  }

  return html;
}

init();
