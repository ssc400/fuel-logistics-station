<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Microsoft YaHei',sans-serif;background:#F5F0EB;color:#333;padding:10px;font-size:12px}
.mtabs{display:flex;gap:0;background:#fff;border-radius:8px;overflow:hidden;border:1px solid #E0D5C8;margin-bottom:8px}
.mtab{padding:9px 24px;cursor:pointer;font-size:13px;color:#555;background:#fff;border-right:1px solid #E0D5C8;user-select:none}

<script>
// ====== IndexedDB 数据库 ======
var MODULES=['配送计划','油库出库','运距分析'];
var DB={
  _v:null,_r:false,_q:[],
  open:function(cb){
    var r=indexedDB.open('FuelStationDB',1);
    r.onupgradeneeded=function(e){
      var d=e.target.result;
      if(!d.objectStoreNames.contains('uploads'))d.createObjectStore('uploads',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('distMap'))d.createObjectStore('distMap');
    };
    r.onsuccess=function(e){DB._v=e.target.result;DB._r=true;DB._q.forEach(function(f){f()});DB._q=[];if(cb)cb()};
    r.onerror=function(e){console.error('DB error',e);setTimeout(function(){if(!DB._r){DB._r=true;if(cb)cb()}},500)};
    r.onblocked=function(){console.warn('DB blocked');setTimeout(function(){if(!DB._r){DB._r=true;if(cb)cb()}},1000)};
  },
  _ok:function(fn){if(DB._r)fn();else DB._q.push(fn)},
  getAll:function(st,cb){DB._ok(function(){var t=DB._v.transaction(st,'readonly').objectStore(st),r=t.getAll();r.onsuccess=function(){cb(r.result)}})},
  put:function(st,val,key){DB._ok(function(){var t=DB._v.transaction(st,'readwrite').objectStore(st);key?t.put(val,key):t.add(val)})},
  upd:function(st,val){DB._ok(function(){var t=DB._v.transaction(st,'readwrite').objectStore(st);t.put(val)})},
  del:function(st,id){DB._ok(function(){DB._v.transaction(st,'readwrite').objectStore(st).delete(id)})},
  clear:function(st){DB._ok(function(){DB._v.transaction(st,'readwrite').objectStore(st).clear()})},
  getUploadsByType:function(type,cb){DB.getAll('uploads',function(ups){cb(ups?ups.filter(function(u){return u.type===type}):[])})},
  getUploadsByModule:function(mod,cb){DB.getAll('uploads',function(ups){cb(ups?ups.filter(function(u){return u.modules&&u.modules.indexOf(mod)>=0}):[])})},
  saveUpload:function(type,name,records,modules,cb){
    var data={type:type,fileName:name,records:records,modules:modules||[type==='delivery'?'配送计划':'油库出库'],recordCount:records.length,createdAt:new Date().toISOString()};
    DB.put('uploads',data);
    if(cb)cb()
  },
  saveDistMap:function(data,cb){DB._ok(function(){DB._v.transaction('distMap','readwrite').objectStore('distMap').put(data,'data');if(cb)cb()})},
  loadDistMap:function(cb){DB._ok(function(){var t=DB._v.transaction('distMap','readonly').objectStore('distMap').get('data');t.onsuccess=function(){cb(t.result||{})}})},
  // 兼容旧localStorage数据迁移
  migrate:function(){
    try{
      var ds=localStorage.getItem('ds_del');if(ds){var d=JSON.parse(ds);if(d&&d.records&&d.records.length){d.records.forEach(function(r){if(typeof r.dist!=='number')r.dist=0;if(typeof r.cang!=='number')r.cang=0;if(!r._src)r._src='历史数据'});DB.put('uploads',{type:'delivery',fileName:'[迁移]配送计划',records:d.records,modules:['配送计划'],recordCount:d.records.length})}}
      var dp=localStorage.getItem('ds_dep');if(dp){var d2=JSON.parse(dp);if(d2&&d2.records&&d2.records.length)DB.put('uploads',{type:'depot',fileName:'[迁移]油库出库',records:d2.records,modules:['油库出库'],recordCount:d2.records.length})}
      var dm=localStorage.getItem('ds_distMap');if(dm){var d3=JSON.parse(dm);if(d3&&Object.keys(d3).length)DB.saveDistMap(d3)}
      localStorage.removeItem('ds_del');localStorage.removeItem('ds_dep');localStorage.removeItem('ds_distMap');
    }catch(e){console.log('迁移:',e.message)}
  }
};
// IndexedDB 打开后自动迁移旧数据
DB.open(function(){DB.migrate()});
// 向下兼容：保留LS对象用于非数据类存储
var LS={g:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},s:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
var curMod=0,delData=null,depData=null,delPeriod='月',depPeriod='月',distMap={};
function dateKey(d){return d.toISOString().slice(0,10)}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function findIdx(hdr,names){for(var i=0;i<hdr.length;i++){for(var n=0;n<names.length;n++){if(String(hdr[i]).indexOf(names[n])>=0)return i}}return -1}
function getMonthKey(d){var m=d.match(/^(\d{4})-(\d{2})/);return m?m[1]+'-'+m[2]:''}
function getYearKey(d){return d.substring(0,4)}
function getDateRange(recs){
  if(!recs||!recs.length)return '';
  var mn=null,mx=null;
  recs.forEach(function(r){
    if(!r.date)return;
    if(mn===null||r.date<mn)mn=r.date;
    if(mx===null||r.date>mx)mx=r.date;
  });
  return (mn||'?')+' ~ '+(mx||'?');
}
// 文件加载遮罩（纯CSS spinner，不会被JS阻塞冻结）
var _flEl=null;
function showFileLoading(msg){
  if(_flEl)_flEl.remove();
  _flEl=document.createElement('div');
  _flEl.id='flLoading';
  _flEl.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:99999;display:flex;align-items:center;justify-content:center';
  _flEl.innerHTML='<div style="background:#fff;border-radius:16px;padding:40px 48px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.15)">'+
    '<div style="width:48px;height:48px;margin:0 auto 16px;border:4px solid #E8E4DA;border-top-color:#3A5C4A;border-radius:50%;animation:flSpin 1s linear infinite"></div>'+
    '<style>@keyframes flSpin{to{transform:rotate(360deg)}}</style>'+
    '<div style="font-size:15px;color:#2C2A28;font-weight:500">'+(msg||'解析文件中，请稍候...')+'</div></div>';
  document.body.appendChild(_flEl);
}
function hideFileLoading(){if(_flEl){_flEl.remove();_flEl=null}}
// 同比环比计算
function calcYoy(cur,prev){
  if(!prev||prev===0)return{val:0,pct:0,dir:'flat',abs:0};
  var diff=cur-prev;
  return{val:diff,pct:Math.round(diff/prev*1000)/10,dir:diff>0?'up':diff<0?'down':'flat',abs:cur,prev:prev};
}

var PLATE_RX=/^[京津冀沪渝冀豫云辽黑湘皖鲁新苏浙赣鄂桂甘晋蒙陕吉闽贵粤川青藏琼宁][A-Z][A-Z0-9]{4,6}$/;
function isValidPlate(v){return PLATE_RX.test(v)}

var EQUITY_COS=[];
function isEquityCo(n){return EQUITY_COS.some(function(e){return n.indexOf(e)>=0||e.indexOf(n)>=0})}

var DEPOT_CLASS=[
  {k:['南宁油库','广西南宁油库'],t:'自有库',l:'自有库'},
  {k:['柳江油库','广西柳江油库'],t:'自有库',l:'自有库'},
  {k:['柳州油库','广西柳州油库'],t:'自有库',l:'自有库'},
  {k:['桂林油库','广西桂林油库'],t:'自有库',l:'自有库'},
  {k:['兴业油库','广西兴业油库'],t:'自有库',l:'自有库'},
  {k:['百色油库','广西百色油库'],t:'自有库',l:'自有库'},
  {k:['梧州新恒丰油库','新恒丰油库'],t:'自有库',l:'自有库'},
  {k:['贺州城西油库','城西油库'],t:'自有库',l:'自有库'},
  {k:['广西石化直发库'],t:'广西石化直发库',l:'广西石化直发库'},
  {k:['中石化互供库'],t:'中石化互供库',l:'中石化互供库'},
  {k:['中海油互供库'],t:'中海油互供库',l:'中海油互供库'},
  {k:['外采库'],t:'外采库',l:'外采库'},
];
function classifyDepot(n){
  if(!n) return {t:'外采库',l:'外采库'};
  for(var i=0;i<DEPOT_CLASS.length;i++){for(var k=0;k<DEPOT_CLASS[i].k.length;k++){if(n.indexOf(DEPOT_CLASS[i].k[k])>=0)return{t:DEPOT_CLASS[i].t,l:DEPOT_CLASS[i].l}}}
  if(n.indexOf('石化')>=0) return {t:'中石化互供库',l:'中石化互供库'};
  if(n.indexOf('油库')>=0) return {t:'自有库',l:'自有库'};
  return {t:'外采库',l:'外采库'};
}

// 多选下拉框
var _msS={};
function initMS(id,items,onChange){
  var w=document.getElementById(id);if(!w)return;
  var old=_msS[id],oldV=old?old.vals:[];
  var nv=items.map(function(i){return i.value});
  if(oldV.length){nv=oldV.filter(function(v){return items.some(function(i){return i.value===v})});if(!nv.length)nv=items.map(function(i){return i.value})}
  _msS[id]={items:items||[],vals:nv,onChange:onChange||function(){},dd:'msdd_'+id};renderMS(id);
}
function getMSVals(id){var s=_msS[id];return s?s.vals.slice():[]}
function getMSTxt(id,s){var c=s.vals.length,t=s.items.length;if(c===0)return'(日)';if(c===t)return'全部('+t+')';var lbs=[];s.items.forEach(function(i){if(s.vals.indexOf(i.value)>=0)lbs.push(i.label)});return lbs.length<=2?lbs.join('、'):'已选'+c+'项'}
function renderMS(id){var s=_msS[id];if(!s)return;var w=document.getElementById(id);if(!w)return;var c=s.vals.length,t=s.items.length;w.innerHTML='<div class="ms-trigger" onclick="tgMS(\''+id+'\')"><span>'+getMSTxt(id,s)+'</span><span class="ms-arrow">▼</span></div><div class="ms-dd" id="'+s.dd+'"><div class="ms-all" onclick="msAll(\''+id+'\')"><input type="checkbox"'+(c===t&&t>0?' checked':'')+'> 全选</div>'+s.items.map(function(i){var ck=s.vals.indexOf(i.value)>=0?' checked':'';return '<div class="ms-item" onclick="msTg(\''+id+'\',\''+i.value+'\')"><input type="checkbox"'+ck+'> '+i.label+'</div>'}).join('')+'</div>'}
function tgMS(id){var s=_msS[id];if(!s)return;var dd=document.getElementById(s.dd);if(!dd)return;var show=dd.style.display!=='block';document.querySelectorAll('.ms-dd').forEach(function(e){e.style.display='none'});document.querySelectorAll('.ms-wrap').forEach(function(e){e.classList.remove('open')});if(show){dd.style.display='block';document.getElementById(id).classList.add('open')}}
function msTg(id,val){var s=_msS[id];if(!s)return;var i=s.vals.indexOf(val);if(i>=0)s.vals.splice(i,1);else s.vals.push(val);var dd=document.getElementById(s.dd);if(dd){var cbs=dd.querySelectorAll('input');cbs.forEach(function(cb,i){if(i===0)cb.checked=s.vals.length===s.items.length;else{var it=s.items[i-1];if(it)cb.checked=s.vals.indexOf(it.value)>=0}})}var w=document.getElementById(id);if(w){var t=w.querySelector('.ms-trigger span:first-child');if(t)t.textContent=getMSTxt(id,s)}msChanged()}
function msAll(id){var s=_msS[id];if(!s)return;var dd=document.getElementById(s.dd);var ac=dd&&dd.querySelector('.ms-all input');var ck=ac?!ac.checked:true;s.vals=ck?s.items.map(function(i){return i.value}):[];if(dd){dd.querySelectorAll('input').forEach(function(cb){cb.checked=ck})}var w=document.getElementById(id);if(w){var t=w.querySelector('.ms-trigger span:first-child');if(t)t.textContent=getMSTxt(id,s)}msChanged()}

function parseDeliveryRecords(res){
  var hdr=res.hdr,delim=res.delim;
  var idxDate=findIdx(hdr,['配送日期','出库日期','日期']),idxBiz=findIdx(hdr,['业务类型']),idxBranch=findIdx(hdr,['分公司']);
  var idxPickup=findIdx(hdr,['提油机构','发货单位','油库机构']),idxOil=findIdx(hdr,['油品名称']),idxOutT=findIdx(hdr,['出库(吨','出库']);
  var idxPlan=findIdx(hdr,['计划(吨','计划量','计划']);if(idxPlan<0&&hdr.length>10)idxPlan=10;
  var idxStatus=findIdx(hdr,['计划状态']),idxVehicle=findIdx(hdr,['车辆']),idxFleet=findIdx(hdr,['车队']),idxReceive=findIdx(hdr,['收油机构','用户名称']),idxDist=findIdx(hdr,['运距','距离']);if(idxDist<0&&hdr.length>22)idxDist=22;var idxCang=findIdx(hdr,['车仓','仓位']);if(idxCang<0&&hdr.length>28)idxCang=28;
  if(idxDate<0||idxStatus<0||idxOutT<0){alert('无法找到关键列（日期/计划状态/出库量）\n检测到的表头：'+JSON.stringify(hdr));console.log('表头:',hdr,'idxDate:',idxDate,'idxStatus:',idxStatus,'idxOutT:',idxOutT);return null}
  // 验证：检查第一行数据
  if(res.rows&&res.rows.length>0){
    var testRow=res.rows[0].split(delim);
    console.log('第一行数据:',JSON.stringify(testRow));
    console.log('列索引: date:',idxDate,'status:',idxStatus,'outT:',idxOutT,'vehicle:',idxVehicle);
    console.log('date值:',testRow[idxDate],'status值:',testRow[idxStatus],'outT值:',testRow[idxOutT],'vehicle值:',testRow[idxVehicle]);
  }
  var recs=[];
  for(var ri=0;ri<res.rows.length;ri++){
    var c=res.rows[ri].split(delim);
    if(c.length<=Math.max(idxDate,idxStatus,idxOutT))continue;
    var st=(c[idxStatus]||'').replace(/^=/,'').replace(/"/g,'').trim();
    if(st!=='复核通过'&&st!=='已下发')continue;
    var biz=idxBiz>=0?(c[idxBiz]||'').replace(/^=/,'').replace(/"/g,'').trim():'';
    if(biz&&biz.indexOf('内部配送')<0)continue;

function parseFile(f,cb){
  showFileLoading('解析文件中，请稍候...');
  var isExcel=/\.xlsx?$/i.test(f.name);
  if(isExcel){
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var data=new Uint8Array(e.target.result);
        var wb=XLSX.read(data,{type:'array',cellText:false,cellDates:true});
        var sn=wb.SheetNames[0];
        if(wb.SheetNames.length>1){
          for(var i=1;i<wb.SheetNames.length;i++){
            if(wb.SheetNames[i].indexOf('运距')>=0||wb.SheetNames[i].indexOf('距离')>=0){sn=wb.SheetNames[i];break}
          }
        }
        var ws=wb.Sheets[sn];
        if(!ws){hideFileLoading();alert('无法读取工作表');return}
        var csv=XLSX.utils.sheet_to_csv(ws,{defval:''});
        parseCsvText(csv,cb);
      }catch(er){hideFileLoading();alert('解析失败：'+er.message)}
    };
    reader.readAsArrayBuffer(f);
  }else{
    var reader2=new FileReader();
    reader2.onload=function(e2){
      try{
        var arr=new Uint8Array(e2.target.result);
        var csv;
        try{
          csv=new TextDecoder('GBK').decode(arr);
        }catch(e){
          csv=new TextDecoder('utf-8').decode(arr);
        }
        parseCsvText(csv,cb);
      }catch(er){hideFileLoading();alert('解析失败：'+er.message)}
    };
    reader2.readAsArrayBuffer(f);
  }
}
function parseCsvText(csv,cb){
  var lines=csv.split(/\r?\n/);
  if(lines.length<2){hideFileLoading();alert('文件内容不足');return}
  var delim=',';
  if(lines.some(function(l){return l.trim()&&l.split('\t').length>l.split(',').length}))delim='\t';
  var hdrIdx=-1;
  var hdrKeywords=[['配送日期','出库日期','日期'],['收油机构','用户名称'],['计划状态'],['出库','计划量'],['车辆','车号'],['油品名称','品名'],['分公司']];
  for(var hi=0;hi<lines.length;hi++){
    var hl=lines[hi].trim();if(!hl)continue;
    var hp=hl.split(delim).map(function(s){return s.replace(/^"|"$/g,'').trim()});
    if(hp.length<3)continue;
    var matchCt=0;
    hdrKeywords.forEach(function(kw){
      kw.forEach(function(k){if(hp.some(function(hh){return hh.indexOf(k)>=0})){matchCt++;return}})
    });
    if(matchCt>=3){hdrIdx=hi;break}
  }
  if(hdrIdx<0&&lines.length>2){
    var testHp=lines[2].split(delim).map(function(s){return s.replace(/^"|"$/g,'').trim()});
    if(testHp.length>=5)hdrIdx=2;
  }
  if(hdrIdx<0)hdrIdx=0;
  var hdr=lines[hdrIdx].split(delim).map(function(s){return s.replace(/^"|"$/g,'').trim()});
  console.log('表头行索引:',hdrIdx,'表头:',JSON.stringify(hdr));
  var rows=[];
  for(var ri=hdrIdx+1;ri<lines.length;ri++){var l=lines[ri].trim();if(l)rows.push(l)}
  hideFileLoading();
  cb({hdr:hdr,delim:delim,rows:rows});
}

// ====== 表格排序 ======
var _sortSt={};
function sortTable(th){
  var tbl=th.closest('table'),tbody=tbl.querySelector('tbody');
  if(!tbody)return;
  var thead=tbl.querySelector('thead'),ths=thead?[].slice.call(thead.querySelectorAll('tr:first-child th')):[];
  var idx=ths.indexOf(th);if(idx<0)return;
  var key=tbl.id||(tbl.parentNode.className+'_'+idx);
  _sortSt[key]=_sortSt[key]||{dir:1};
  _sortSt[key].dir=_sortSt[key].col===idx?-_sortSt[key].dir:1;_sortSt[key].col=idx;
  ths.forEach(function(h){h.classList.remove('sort-asc','sort-desc')});
  th.classList.add(_sortSt[key].dir>0?'sort-asc':'sort-desc');
  var rows=[].slice.call(tbody.querySelectorAll('tr'));
  rows.sort(function(a,b){
    var va=a.cells[idx]?a.cells[idx].textContent.trim():'',vb=b.cells[idx]?b.cells[idx].textContent.trim():'';
    var na=parseFloat(va.replace(/[^0-9.\-]/g,'')),nb=parseFloat(vb.replace(/[^0-9.\-]/g,''));
    if(!isNaN(na)&&!isNaN(nb))return(na-nb)*_sortSt[key].dir;
    return va.localeCompare(vb,'zh-CN')*_sortSt[key].dir;
  });
  rows.forEach(function(r){tbody.appendChild(r)});
}
document.addEventListener('click',function(e){
  var th=e.target.closest('.tw th,.vg th');
  if(th)sortTable(th);
});

      var html='<div class="prow"><span class="fl">📎 数据库管理</span> <span class="ubtn" onclick="showDbUpload()" style="color:#3A5C4A;border-color:#3A5C4A;margin-left:8px">📤 上传到数据库</span></div>'+
        '<div class="sg" style="grid-template-columns:repeat(5,1fr)">'+
        '<div class="sc"><div class="sl">上传记录</div><div class="sv bl">'+(ups?ups.length:0)+'</div><div class="sub">份文件</div></div>'+
        '<div class="sc"><div class="sl">配送计划</div><div class="sv or">'+(ups?ups.filter(function(u){return u.modules&&u.modules.indexOf('配送计划')>=0}).reduce(function(s,u){return s+(u.records?u.records.length:0)},0):0)+'</div><div class="sub">条</div></div>'+
        '<div class="sc"><div class="sl">油库出库</div><div class="sv pu">'+(ups?ups.filter(function(u){return u.modules&&u.modules.indexOf('油库出库')>=0}).reduce(function(s,u){return s+(u.records?u.records.length:0)},0):0)+'</div><div class="sub">条</div></div>'+
        '<div class="sc"><div class="sl">运距映射</div><div class="sv gn">'+dmCnt+'</div><div class="sub">条</div></div>'+
        '<div class="sc"><div class="sl">总记录数</div><div class="sv gr">'+(ups?ups.reduce(function(s,u){return s+(u.records?u.records.length:0)},0):0)+'</div><div class="sub">行数据</div></div>'+
        '</div>';
      if(!ups||!ups.length){
        html+='<div class="nod">数据库为空，请点击上方📤 "上传到数据库"按钮添加数据</div>';el.innerHTML=html;return
      }
      html+='<div class="tw" style="margin-top:4px"><table><thead><tr><th>文件名</th><th>类型</th><th>记录数</th><th>引用模块</th><th>上传时间</th><th>操作</th></tr></thead><tbody>';
      ups.forEach(function(u){
        var typeLabel={'delivery':'📝配送','depot':'🏭出库','distMap':'📹运距'}[u.type]||u.type;
        var modHtml='';MODULES.forEach(function(m){
          var ck=u.modules&&u.modules.indexOf(m)>=0;
          modHtml+='<label style="display:inline-flex;align-items:center;gap:2px;margin:1px 4px;font-size:10px;cursor:pointer;'+(ck?'color:#3A5C4A;font-weight:600':'color:#999')+'" onclick="event.stopPropagation();togMod('+u.id+',\''+m+'\',this)"><input type="checkbox" '+(ck?'checked':'')+' style="width:10px;height:10px;margin:0">'+m+'</label>'
        });
        html+='<tr><td class="l">📫 '+(u.fileName||'未知')+'</td><td>'+typeLabel+'</td><td>'+(u.recordCount||(u.records?u.records.length:0))+'</td><td style="font-size:10px">'+modHtml+'</td><td style="font-size:10px;color:#999">'+(u.createdAt?u.createdAt.slice(0,10):'-')+'</td>'+
          '<td><span class="ubtn del" style="padding:2px 8px;font-size:9px" onclick="DB.del(\'uploads\','+u.id+');renderDB();loadAllData()">✕</span></td></tr>'
      });
      html+='</tbody></table></div>';
      if(dmCnt>0){
        var dk=Object.keys(dm).slice(0,8);
        html+='<div class="vg" style="margin-top:4px"><div class="vt">📹 运距映射 ('+dmCnt+' 条，预览前8条)</div><table><tr><th>提油机构</th><th>加油站</th><th>运距</th></tr>';
        dk.forEach(function(k){var p=k.split('||');html+='<tr><td class="l">'+(p[0]||'')+'</td><td class="l">'+(p[1]||'')+'</td><td class="r">'+dm[k].toFixed(1)+'</td></tr>'});
        html+='</table></div>'
      }
      html+='<div style="text-align:center;margin:10px 0"><span class="ubtn del" onclick="if(confirm(\'确定清空整个数据库？\')){DB.clear(\'uploads\');DB.clear(\'distMap\');loadAllData();renderDB()}">🗑 清空数据库</span></div>';
      el.innerHTML=html
    })
  })
}
function togMod(id,mod,el){
  DB._ok(function(){
    var t=DB._v.transaction('uploads','readwrite'),o=t.objectStore('uploads'),r=o.get(id);
    r.onsuccess=function(){
      var d=r.result;
      if(!d.modules)d.modules=[];
      var idx=d.modules.indexOf(mod);
      if(idx>=0)d.modules.splice(idx,1);else d.modules.push(mod);
      o.put(d);
      var cb=el.querySelector('input[type=checkbox]');
      if(cb){cb.checked=idx<0;el.style.color=idx<0?'#3A5C4A':'#999';el.style.fontWeight=idx<0?'600':'400'}
    }
  })
}
function showDbUpload(){
  var html='<div id="dbUpOverlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:9999;display:flex;align-items:center;justify-content:center" onclick="if(event.target===this)closeDbUp()">'+
    '<div style="background:#fff;border-radius:8px;padding:20px;max-width:400px;width:90%">'+
    '<div style="font-size:14px;font-weight:600;margin-bottom:8px">📤 上传到数据库</div>'+
    '<div style="font-size:11px;color:#888;margin-bottom:12px">选择文件类型和数据来源</div>'+
    '<div style="margin-bottom:10px"><label style="font-size:11px;font-weight:600;color:#555">数据类型</label>'+
    '<select id="dbUpType" style="width:100%;margin-top:4px;padding:6px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px">'+
    '<option value="delivery">📝 配送计划</option><option value="depot">🏭 油库出库</option><option value="distMap">📹 运距映射表</option></select></div>'+
    '<div style="margin-bottom:10px"><label style="font-size:11px;font-weight:600;color:#555">引用模块（多选）</label>';
  MODULES.forEach(function(m){
    html+='<label style="display:flex;align-items:center;gap:4px;padding:3px 0;font-size:11px;cursor:pointer"><input type="checkbox" checked value="'+m+'" style="width:12px;height:12px;accent-color:#3A5C4A;cursor:pointer"> '+m+'</label>'
  });
  html+='</div><div style="text-align:center;margin-top:12px">'+
    '<span class="ubtn" onclick="doDbUpload()" style="padding:6px 20px">📤 选择文件上传</span></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
}
function closeDbUp(){var el=document.getElementById('dbUpOverlay');if(el)el.remove()}
function doDbUpload(){
  var type=document.getElementById('dbUpType').value;
  var mods=[];document.querySelectorAll('#dbUpOverlay input[type=checkbox]').forEach(function(cb){if(cb.checked)mods.push(cb.value)});
  if(!mods.length){alert('至少选择一个引用模块');return}
  closeDbUp();
  var inp=document.createElement('input');inp.type='file';inp.accept='.csv,.xlsx,.xls,.xlsm';
  inp.onchange=function(){
    if(!inp.files||!inp.files[0])return;
    var f=inp.files[0];
    if(type==='distMap'){
      parseFile(f,function(res){
        try{
          var hdr=res.hdr,delim=res.delim;
          var idxP=findIdx(hdr,['提油机构','油库','发货单位','提油点','提油']);
          var idxR=findIdx(hdr,['收油机构','加油站','到货','站点','油站','加油站名','加油站名称']);
          var idxD=findIdx(hdr,['运距','距离','公里','里程','路']);
          var idxStation=findIdx(hdr,['加油站','站点名称','站名']);
          if(idxStation<0)idxStation=findIdx(hdr,['加油站名','加油站名称']);
          var cnt=0;
          if(idxP>=0&&idxR>=0&&idxD>=0){
            for(var ri=0;ri<res.rows.length;ri++){var c=res.rows[ri].split(delim);if(c.length<=Math.max(idxP,idxR,idxD))continue;var pu=(c[idxP]||'').trim(),re=(c[idxR]||'').trim(),di=parseFloat(String(c[idxD]).replace(/[^0-9.\-]/g,''));if(pu&&re&&di>0){distMap[pu+'||'+re]=di;cnt++}}
          }else if(idxStation>=0){
            var depCols=[];for(var ci=3;ci<hdr.length;ci++){var hn=(hdr[ci]||'').trim();if(hn&&hn.indexOf('序号')<0&&hn.indexOf('地区')<0&&hn.indexOf('加油站')<0&&hn.indexOf('站点')<0)depCols.push(ci)}
            for(var ri=0;ri<res.rows.length;ri++){var c=res.rows[ri].split(delim);if(c.length<=idxStation)continue;var station=(c[idxStation]||'').trim();if(!station)continue;for(var di=0;di<depCols.length;di++){var ci2=depCols[di],depot=(hdr[ci2]||'').trim(),dist=parseFloat(String(c[ci2]||'').replace(/[^0-9.\-]/g,''));if(depot&&dist>0){distMap[depot+'||'+station]=dist;cnt++}}}
          }
          if(!cnt){alert('未解析到有效运距数据');return}
          DB.saveDistMap(distMap);
          var btn=document.getElementById('distMapBtn');if(btn){btn.textContent='✓ 运距已加载'+cnt+'条';btn.className='ubtn ok'}
          alert('✓ 运距映射已更新：'+cnt+' 条');
          loadAllData();
        }catch(er){alert('解析失败：'+er.message)}
      });
    }else{
      parseFile(f,function(res){
        try{
          var recs=type==='delivery'?parseDeliveryRecords(res):parseDepotRecords(res);
          if(!recs||recs.length===0){alert('没有符合条件的数据');return}
          recs.forEach(function(r){r._src=f.name});
          DB.saveUpload(type,f.name,recs,mods);
          alert('✓ 已上传'+recs.length+' 条到：'+mods.join('、'));
          loadAllData();
        }catch(er){alert('解析失败：'+er.message)}
      });
    }
    inp.value='';
  };
  inp.click();
}

// ====== 从数据库加载数据 ======
function loadDelData(cb){
  DB.getUploadsByModule('配送计划',function(ups){
    if(!ups||!ups.length){delData=null;if(cb)cb();return}
    var all=[],files=[];
    ups.forEach(function(u){
      u.records.forEach(function(r){r._src=u.fileName});Array.prototype.push.apply(all,u.records);
      if(files.indexOf(u.fileName)<0)files.push(u.fileName)
    });
    delData={records:all,files:files};
    if(cb)cb()
  })
}
function loadDepData(cb){
  DB.getUploadsByModule('油库出库',function(ups){
    if(!ups||!ups.length){depData=null;if(cb)cb();return}
    var all=[];
    ups.forEach(function(u){Array.prototype.push.apply(all,u.records)});
    depData={records:all};
    if(cb)cb()
  })
}
function loadDistMap(cb){
  DB.loadDistMap(function(dm){distMap=dm||{};if(cb)cb()})
}
function loadAllData(cb){
  loadDelData(function(){loadDepData(function(){loadDistMap(function(){reRender();if(cb)cb()})})})
}
// ====== 数据管理 ======
function showDataMgr(){
  DB.getAll('uploads',function(ups){
    if(!ups||!ups.length){alert('数据库中没有数据');return}
    var html='<div id="dbOverlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:9999;display:flex;align-items:center;justify-content:center" onclick="if(event.target===this)closeDbMgr()">'+
      '<div style="background:#fff;border-radius:8px;padding:16px 20px;max-width:550px;width:90%;max-height:75vh;overflow-y:auto">'+
      '<div style="font-size:14px;font-weight:600;margin-bottom:8px">📎 数据库 - 已上传的数据</div>'+
      '<div style="font-size:11px;color:#888;margin-bottom:10px">共'+ups.length+' 条上传记录，总计 '+ups.reduce(function(s,u){return s+(u.records?u.records.length:0)},0)+' 条数据</div>';
    ['delivery','depot','distMap'].forEach(function(tp){
      var pool=ups.filter(function(u){return u.type===tp}),label={'delivery':'配送计划','depot':'油库出库','distMap':'运距映射表'}[tp];
      if(!pool.length)return;
      html+='<div style="margin:6px 0;font-size:11px;font-weight:600;color:#3A5C4A">📨 '+label+' ('+pool.length+' 份)</div>';
      pool.forEach(function(u){
        var cnt=u.records?u.records.length:Object.keys(u.data||{}).length;
        html+='<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 8px;border-bottom:1px solid #f0f0f0;font-size:10px">'+
          '<span>📫 '+(u.fileName||'未知')+'</span><span style="color:#999">'+cnt+' 条</span><span style="color:#bbb;font-size:9px">'+(u.createdAt?u.createdAt.slice(0,10):'')+'</span>'+
          '<span class="ubtn del" style="padding:1px 6px;font-size:9px;margin:0" onclick="DB.del(\'uploads\','+u.id+');showDataMgr();loadAllData()">✕</span></div>'
      })
    });
    html+='<div style="text-align:center;margin-top:12px"><span class="ubtn" onclick="closeDbMgr()" style="padding:4px 20px">关闭</span> <span class="ubtn del" onclick="if(confirm(\'确定清除数据库中所有数据？\')){DB.clear(\'uploads\');DB.clear(\'distMap\');closeDbMgr();loadAllData()}" style="padding:4px 14px">🗑 清空数据库</span></div></div></div>';
    document.body.insertAdjacentHTML('beforeend',html);
  })
}
function closeDbMgr(){var el=document.getElementById('dbOverlay');if(el)el.remove()}

// ====== 初始化 ======
function init(){loadAllData()}
init();
</script>
