<script>
var app = document.getElementById('app');
var APP_MODE = 'station'; // 'station' 油库→加油站(矩阵) ; 'customer' 油库→客户配送(CSV逐行)
var DEPOT_DATA = null;  // 油库数据
var STATION_DATA = null; // 站运距数据(矩阵)
var CUSTOMER_DATA = null; // 客户配送数据(CSV逐行)
// AMAP_READY 已不再需要（地理编码改 REST API，不依赖 JSAPI 插件）
var CHECK_RESULTS = {};
var CHECKING = false;
var CHECK_QUEUE = [];
var CHECK_TOTAL = 0;
var CHECK_DONE = 0;
// 地理编码改 REST API，不再需要 JSAPI 的 geocoder/driving 实例

// ===== 持久化 key 前缀（含版本号：改版后旧缓存自动失效，避免显示旧结果）=====
var PK='distVer_1993_';
// Geocode 缓存（避免同地址重复编码）
var GEO_CACHE={};
// 驾车距离缓存（相同 油库→目的地 复用，极大减少高德请求）
var DRIVING_CACHE={};
// 并发池参数
var MAX_CONCURRENT=30;   // 同时进行的(地理编码+驾车)请求数
var _active=0;           // 当前在途请求数
var _lastSave=0;         // 上次 saveState 时间戳
var _checkFinished=false;// 完成标记（防 finishCheck 重复调用）
var _checkStartTs=0;     // 开始时间戳（用于实时预估剩余）
var _checkStartDone=0;   // 开始时已完成数

// 高德 Web 服务 API Key（用于 REST API 驾车路线规划，比 JSAPI AMap.Driving 更稳定）
var AMAP_KEY='';

// ===== 站名归一化与底库查坐标（v1.991 加城市/区县区域过滤）=====
function normStationName(n){
  return String(n||'').replace(/中国石油|中国石化|中石化|中石油|加油站|（/g,'').replace(/）/g,'').replace(/\s+/g,'').trim();
}
// 规范化"百色市"→"百色"、"梧州市"→"梧州"、"藤县"→"藤县"
function normCityDistrict(s){
  return String(s||'').replace(/市$|县$|区$/,'').trim();
}
// 油库名归一化（矩阵列名 ↔ 油库文件名的鲁棒匹配，v1.993）
function normDepot(n){
  return String(n||'').replace(/广西|中国石油|中国石化|中石化|中石油|中海油|中化|加油站/g,'')
    .replace(/油库|石化|石油|库/g,'').replace(/\s+/g,'').trim();
}
// 鲁棒匹配：矩阵油库列名 → 油库文件中的油库对象
function matchDepotRobust(depotName, depotMap){
  if(!depotMap)return null;
  if(depotMap[depotName])return depotMap[depotName];              // 1. 原名精确
  var nk=normDepot(depotName);
  if(!nk)return null;
  for(var dk in depotMap){ if(normDepot(dk)===nk)return depotMap[dk]; }   // 2. 归一完全相等
  for(var dk2 in depotMap){ var m=normDepot(dk2); if(m&&(nk.indexOf(m)>=0||m.indexOf(nk)>=0))return depotMap[dk2]; } // 3. 子串
  return null;
}
function lookupBaseCoords(name, area, city, district){
  var nn=normStationName(name);
  var nc=normCityDistrict(city||area);
  var nd=normCityDistrict(district);
  // 第一优先：精确匹配（站名+城市/区县一致）
  if(BASE_NORM){
    var exact=[];
    for(var k in BASE_NORM){
      if(k===nn)exact.push(BASE_NORM[k]);
    }
    if(exact.length>0){
      // 如果只有一个匹配，直接返回
      if(exact.length===1)return exact[0];
      // 多个同名匹配，优先选城市/区县一致的
      for(var i=0;i<exact.length;i++){
        var bcn=normCityDistrict(exact[i].c);
        var bdn=normCityDistrict(exact[i].d);
        if((nc&&bcn===nc)||(nd&&bdn===nd))return exact[i];
      }
      return exact[0];
    }
    // 第二优先：模糊匹配（要求长度>=4避免误中），且优先选城市/区县一致的
    var fuzzy=[];
    for(var k2 in BASE_NORM){
      if(k2.length>=4 && nn.length>=4 && (k2.indexOf(nn)>=0 || nn.indexOf(k2)>=0)){
        fuzzy.push(BASE_NORM[k2]);
      }
    }
    if(fuzzy.length===1)return fuzzy[0];
    if(fuzzy.length>1){
      // 多个模糊匹配，优先城市一致的，其次区县一致的
      for(var i2=0;i2<fuzzy.length;i2++){
        var bcn2=normCityDistrict(fuzzy[i2].c);
        if(nc && bcn2===nc)return fuzzy[i2];
      }
      for(var i3=0;i3<fuzzy.length;i3++){
        var bdn3=normCityDistrict(fuzzy[i3].d);
        if(nd && bdn3===nd)return fuzzy[i3];
      }
      return fuzzy[0];
    }
  }
  return null;
}

// ===== 持久化：保存/恢复状态到 sessionStorage =====
function saveState(){
  try{
    // v1.992: 写入数据格式版本号，用于检测旧格式缓存
    sessionStorage.setItem(PK+'fmtVer','1992');
    if(DEPOT_DATA)sessionStorage.setItem(PK+'depot',JSON.stringify(DEPOT_DATA));
    else sessionStorage.removeItem(PK+'depot');
    if(STATION_DATA)sessionStorage.setItem(PK+'station',JSON.stringify(STATION_DATA));
    else sessionStorage.removeItem(PK+'station');
    if(CUSTOMER_DATA)sessionStorage.setItem(PK+'customer',JSON.stringify(CUSTOMER_DATA));
    else sessionStorage.removeItem(PK+'customer');
    if(Object.keys(CHECK_RESULTS).length>0)sessionStorage.setItem(PK+'results',JSON.stringify(CHECK_RESULTS));
    else sessionStorage.removeItem(PK+'results');
    sessionStorage.setItem(PK+'mode',APP_MODE);
    sessionStorage.setItem(PK+'checking',String(CHECKING));
    sessionStorage.setItem(PK+'done',String(CHECK_DONE));
    sessionStorage.setItem(PK+'total',String(CHECK_TOTAL));
  }catch(e){/* sessionStorage 可能满或不可用 */}
}
function restoreState(){
  try{
    // v1.992: 检查数据格式版本，旧版本自动失效
    var fv=sessionStorage.getItem(PK+'fmtVer');
    if(fv && fv!=='1992'){
      console.log('[DEBUG] 旧格式缓存(fmtVer='+fv+')，忽略');
      return false;
    }
    var d=sessionStorage.getItem(PK+'depot');if(d)DEPOT_DATA=JSON.parse(d);
    var s=sessionStorage.getItem(PK+'station');if(s)STATION_DATA=JSON.parse(s);
    var c=sessionStorage.getItem(PK+'customer');if(c)CUSTOMER_DATA=JSON.parse(c);
    var r=sessionStorage.getItem(PK+'results');if(r)CHECK_RESULTS=JSON.parse(r);
    var m=sessionStorage.getItem(PK+'mode');if(m)APP_MODE=m;
    var ch=sessionStorage.getItem(PK+'checking');if(ch==='true')CHECKING=true;
    var dn=sessionStorage.getItem(PK+'done');if(dn)CHECK_DONE=parseInt(dn)||0;
    var tt=sessionStorage.getItem(PK+'total');if(tt)CHECK_TOTAL=parseInt(tt)||0;
  }catch(e){}
  return !!(DEPOT_DATA&&(STATION_DATA||CUSTOMER_DATA));
}
function clearPersist(){
  Object.keys(sessionStorage).forEach(function(k){
    if(k.indexOf(PK)===0)sessionStorage.removeItem(k);
  });
}

// ===== 解析油库位置 =====
function loadDepotFile(input){
  if(!input.files||!input.files[0])return;
  msg('i','解析油库位置...');
  var f=input.files[0];
  var rd=new FileReader();
  rd.onload=function(e){
    try{
      var data=new Uint8Array(e.target.result);
      var wb=XLSX.read(data,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      var header=rows[0];
      var nameIdx=header.indexOf('油库');
      var lnglatIdx=header.indexOf('经纬度');
      var typeIdx=header.indexOf('油库类型');
      var addrIdx=header.indexOf('地址');

      var depots=[];
      for(var i=1;i<rows.length;i++){
        var r=rows[i];
        var name=String(r[nameIdx]||'').trim();
        var lnglat=String(r[lnglatIdx]||'').trim();
        var type=String(r[typeIdx]||'').trim();
        var addr=String(r[addrIdx]||'').trim();
        if(!name)continue;
        var coords=null;
        if(lnglat&&lnglat.indexOf(',')>0){
          var parts=lnglat.split(',');
          coords={lng:parseFloat(parts[0]),lat:parseFloat(parts[1])};
        }
        depots.push({name:name,type:type,lnglat:lnglat,coords:coords,addr:addr});
      }
      DEPOT_DATA={depots:depots,fileName:f.name};
      // v1.991: 新油库文件加载后清空旧复核结果
      CHECK_RESULTS={};CHECK_DONE=0;CHECK_TOTAL=0;
      msg('s','油库加载完成：'+depots.length+' 个');
      saveState();
      render();
    }catch(er){msg('e','解析失败：'+er.message);}
  };
  rd.readAsArrayBuffer(f);
}

// ===== 解析油站运距 =====
function loadStationFile(input){
  if(!input.files||!input.files[0])return;
  msg('i','解析油站运距...');
  var f=input.files[0];
  var rd=new FileReader();
  rd.onload=function(e){
    try{
      var data=new Uint8Array(e.target.result);
      var wb=XLSX.read(data,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      var header=rows[0];

      var seqIdx=header.indexOf('序号');
      var areaIdx=header.indexOf('地区');
      var nameIdx=header.indexOf('加油站站名');
      // 检测「掩位置/地址/位置/详细地址」列，优先用详细地址做地理编码
      var locCandidates=['掩位置','位置','地址','详细地址','加油站点位','站点地址','地理位置'];
      var locIdx=-1;
      for(var li=0;li<locCandidates.length;li++){
        var _li=header.indexOf(locCandidates[li]);
        if(_li>=0){locIdx=_li;break;}
      }
      // 检测「经纬度」列（优先）和「经度」「纬度」分列——有坐标则跳过地理编码
      var lnglatIdx=header.indexOf('经纬度');
      var lngIdx=header.indexOf('经度');
      var latIdx=header.indexOf('纬度');
      // v1.991: 额外读「城市」「区县」列做底库匹配的区域过滤，避免同名站跨城错配
      var cityIdx=header.indexOf('城市');
      var districtIdx=header.indexOf('区县');

      // v1.992: 智能识别油库距离列（排除销量/坐标/地址等非油库列）
      // 黑名单关键词：销量类、坐标类、地址类、编码类
      var _skipKeys=['加油站编码','E92','92#','95#','98#','汽油','柴油','小计','合计','年度','日度',
        '地理位置','经度','纬度','经纬度','地址','城市','区县','匹配状态','加油站点位','站点位置',
        '掩位置','位置','序号','地区','加油站站名'];
      var depotCols=[];
      for(var j=3;j<header.length;j++){
        var colName=String(header[j]||'').trim();
        if(!colName||colName.startsWith('Unnamed'))continue;
        // 跳过非油库列
        var _isSkip=false;
        for(var si=0;si<_skipKeys.length;si++){
          if(colName.indexOf(_skipKeys[si])>=0){_isSkip=true;break;}
        }
        if(_isSkip)continue;
        depotCols.push({idx:j,name:colName});
      }
      console.log('[DEBUG] 油库列检测: 总候选'+(header.length-3)+'个, 排除后剩余'+depotCols.length+'个油库距离列');

      var stations=[];
      for(var i=1;i<rows.length;i++){
        var r=rows[i];
        var name=String(r[nameIdx]||'').trim();
        if(!name)continue;
        var area=String(r[areaIdx]||'').trim();
        var _loc=locIdx>=0?String(r[locIdx]||'').trim():'';
        // 解析油站坐标：优先「经纬度」列(lng,lat格式)，其次「经度」+「纬度」分列
        var _coords=null;
        if(lnglatIdx>=0){
          var _ll=String(r[lnglatIdx]||'').trim();
          if(_ll&&_ll.indexOf(',')>0){
            var _p=_ll.split(',');
            _coords={lng:parseFloat(_p[0]),lat:parseFloat(_p[1])};
          }
        }
        if(!_coords&&lngIdx>=0&&latIdx>=0){
          var _lg=parseFloat(r[lngIdx]),_lt=parseFloat(r[latIdx]);
          if(!isNaN(_lg)&&!isNaN(_lt)) _coords={lng:_lg,lat:_lt};
        }
        // v1.99: 文件没坐标时，优先查内联底库（避免走 geocode）
        var city=cityIdx>=0?String(r[cityIdx]||'').trim():'';
        var district=districtIdx>=0?String(r[districtIdx]||'').trim():'';
        var _fromBase=false;
        if(!_coords){
          var _base=lookupBaseCoords(name,area,city,district);
          if(_base){ _coords={lng:_base.x,lat:_base.y}; _fromBase=true; }
        }
        var dists={};
        depotCols.forEach(function(dc){
          var v=r[dc.idx];
          if(v!==''&&v!==null&&v!==undefined){
            var val=typeof v==='number'?v:parseFloat(v);
            if(!isNaN(val)&&val>0)dists[dc.name]=Math.round(val);
          }
        });
        stations.push({name:name,area:area,city:cityIdx>=0?String(r[cityIdx]||'').trim():'',district:districtIdx>=0?String(r[districtIdx]||'').trim():'',location:_loc,coords:_coords,fromBase:!!_fromBase,dists:dists});
      }
      STATION_DATA={stations:stations,depotCols:depotCols,fileName:f.name};
      // v1.991: 新文件加载后清空旧复核结果，避免显示上次的旧值
      CHECK_RESULTS={};CHECK_DONE=0;CHECK_TOTAL=0;
      var _locCnt=stations.filter(function(s){return s.location&&s.location.length>0;}).length;
      var _coordCnt=stations.filter(function(s){return s.coords!=null;}).length;
      var _baseCnt=stations.filter(function(s){return s.fromBase;}).length;
      var _fileCoordCnt=_coordCnt-_baseCnt;
      var _needGeoCnt=stations.length-_coordCnt;
      // 调试：输出前3个站的坐标状态（含来源）
      var _dbg=stations.slice(0,3).map(function(s){return s.name+':'+(s.coords?(s.fromBase?'[底库]':'[文件]'):'NO_COORD');});
      console.log('[DEBUG] 油站加载: 总'+stations.length+', 文件坐标='+_fileCoordCnt+', 底库补='+_baseCnt+', 仍需geocode='+_needGeoCnt+', 样例: '+_dbg.join(' | '));
      msg('s','油站加载完成：'+stations.length+' 个，涉及 '+depotCols.length+' 个油库列；其中 <b style="color:#2e7d32">'+_fileCoordCnt+'</b> 个文件坐标 + <b style="color:#1565c0">'+_baseCnt+'</b> 个底库补全 = '+_coordCnt+' 个有坐标（跳过geocode），<b style="color:#c62828">'+_needGeoCnt+'</b> 个仍需地理编码');
      saveState();
      render();
    }catch(er){msg('e','解析失败：'+er.message);}
  };
  rd.readAsArrayBuffer(f);
}

// ===== 解析客户配送 CSV =====
function loadCustomerFile(input){
  if(!input.files||!input.files[0])return;
  msg('i','解析客户配送计划...');
  var f=input.files[0];
  var rd=new FileReader();
  rd.onload=function(e){
    try{
      var buf=e.target.result;
      var text;
      try{text=new TextDecoder('gbk',{fatal:false}).decode(buf);}
      catch(err){text=new TextDecoder('utf-8',{fatal:false}).decode(buf);}
      var rows=parseCSV(text);
      if(rows.length<2){msg('e','CSV 数据行不足');return;}
      var header=rows[0];
      // 列定位：提油油库、收油地址、运距
      var depotIdx=findCol(header,['提油油库','油库','发货油库','出库油库']);
      var destIdx=findCol(header,['收油地址','卸油地址','卸油地点','收货地址','客户地址']);
      var distIdx=findCol(header,['运距','表运距','原始运距']);
      if(depotIdx<0){msg('e','未找到「提油油库」列');return;}
      if(destIdx<0){msg('e','未找到「收油地址」列');return;}
      if(distIdx<0){msg('e','未找到「运距」列');return;}

      var dataRows=[];
      for(var i=1;i<rows.length;i++){
        var r=rows[i];
        var depot=String(r[depotIdx]||'').trim();
        var dest=String(r[destIdx]||'').trim();
        var distVal=r[distIdx];
        if(!depot||!dest)continue;
        var distNum=typeof distVal==='number'?distVal:parseFloat(String(distVal||'').replace(/,/g,''));
        if(isNaN(distNum))distNum=0;
        dataRows.push({depot:depot,dest:dest,tableDist:Math.round(distNum),raw:r});
      }
      CUSTOMER_DATA={rows:dataRows,fileName:f.name,depotIdx:depotIdx,destIdx:destIdx,distIdx:distIdx};
      msg('s','客户配送加载完成：'+dataRows.length+' 条');
      saveState();
      render();
    }catch(er){msg('e','解析失败：'+er.message);}
  };
  rd.readAsArrayBuffer(f);
}

function findCol(header,names){
  for(var i=0;i<header.length;i++){
    var h=String(header[i]||'').trim();
    for(var j=0;j<names.length;j++){
      if(h.indexOf(names[j])>=0)return i;
    }
  }
  return -1;
}

function parseCSV(text){
  var rows=[],row=[],cell='',inQuote=false,i=0;
  while(i<text.length){
    var ch=text[i];
    if(inQuote){
      if(ch==='"'){
        if(text[i+1]==='"'){cell+='"';i++;}
        else{inQuote=false;}
      }else{cell+=ch;}
    }else{
      if(ch==='"'){inQuote=true;}
      else if(ch===','){row.push(cell);cell='';}
      else if(ch==='\n'||(ch==='\r'&&text[i+1]!=='\n')){
        row.push(cell);rows.push(row);row=[];cell='';
        if(ch==='\r'&&text[i+1]==='\n')i++;
      }else if(ch!=='\r'){cell+=ch;}
    }
    i++;
  }
  if(cell||row.length>0){row.push(cell);rows.push(row);}
  return rows;
}

// ===== 匹配油库名称（支持别名） =====
function matchDepot(name,depots){
  if(!name||!depots||depots.length===0)return null;
  var n=name.trim();
  // 先精确匹配
  for(var i=0;i<depots.length;i++){
    var d=depots[i];
    if(d.name===n)return d;
  }
  // 再包含匹配（去除通用词）
  var clean=function(s){return s.replace(/广西|中国石油|中国石化|中石化|中海油|中化|油库|石化/g,'').trim();};
  var nc=clean(n);
  for(var i=0;i<depots.length;i++){
    var d=depots[i];
    var dc=clean(d.name);
    if(nc&&dc&&(d.name.indexOf(nc)>=0||n.indexOf(dc)>=0||dc.indexOf(nc)>=0||nc.indexOf(dc)>=0))return d;
  }
  return null;
}

// ===== 近似距离估算（用坐标直线×1.3）=====
function showApproxCheck(){
  if(!DEPOT_DATA||!STATION_DATA){msg('w','请先上传数据');return;}
  msg('i','正在估算运距...');

  var threshold=parseFloat(document.getElementById('thresholdKm').value)||5;
  var onlyOwn=document.getElementById('onlyOwn')&&document.getElementById('onlyOwn').checked;

  var ownTypes=['自有库','以站代库'];
  var depotMap={};
  DEPOT_DATA.depots.forEach(function(d){
    if(onlyOwn && ownTypes.indexOf(d.type)<0)return;
    if(!d.coords)return;
    depotMap[d.name]=d;
  });

  var results=[];
  STATION_DATA.stations.forEach(function(s){
    Object.keys(s.dists).forEach(function(depotName){
      var tableDist=s.dists[depotName];
      var depotInfo=null;
      // 鲁棒匹配油库名（v1.993）
      depotInfo=matchDepotRobust(depotName, depotMap);
      if(!depotInfo)return;

      // 加油站位置：优先用真实坐标（v1.99修复），没坐标才用地区中心近似
      var destLng=null,destLat=null;
      if(s.coords&&s.coords.lng&&s.coords.lat){
        destLng=s.coords.lng; destLat=s.coords.lat;
      }else{
        // v1.991 用城市中心近似（更精确），fallback 地区
        var areaCenter=getAreaCenter(s.city||s.area);
        if(!areaCenter)return;
        destLng=areaCenter.lon; destLat=areaCenter.lat;
      }

      var estDist=Math.round(geoDist(depotInfo.coords.lat,depotInfo.coords.lng,destLat,destLng)*1.3);
      var diff=tableDist-estDist;
      var status=Math.abs(diff)<=threshold?'ok':(diff>0?'over':'under');

      CHECK_RESULTS[s.name+'_'+depotName]={
        station:s.name,area:s.area,depot:depotName,
        tableDist:tableDist,calcDist:estDist,
        diff:diff,diffPct:tableDist>0?Math.round(Math.abs(diff)/tableDist*100):0,
        status:status,method:'approx',mode:'station',
        depotLng:depotInfo.coords.lng,depotLat:depotInfo.coords.lat,
        destLng:destLng,destLat:destLat,
        depotAddr:depotInfo.addr||'',destAddr:''
      };
    });
  });

  msg('s','估算完成，共 '+Object.keys(CHECK_RESULTS).length+' 条');
  render();
}

// ===== 高德精算异常项（仅对坐标直线复核标记 status!=ok 的对子跑真实路线，省配额）=====
function startAnomalyCheck(){
  if(!DEPOT_DATA||!STATION_DATA){msg('w','请先上传数据');return;}
  if(CHECKING){msg('w','正在复核中...');return;}
  if(Object.keys(CHECK_RESULTS).length===0){msg('w','请先点「坐标直线复核（K列×AW列）」生成基线');return;}
  var anomalies=[];
  Object.keys(CHECK_RESULTS).forEach(function(k){
    var r=CHECK_RESULTS[k];
    if(r.mode==='customer')return;
    if(r.status==='ok')return;                                  // 只精算异常项
    if(r.depotLng==null||r.depotLat==null||r.destLng==null||r.destLat==null)return;
    anomalies.push(r);
  });
  if(anomalies.length===0){msg('s','没有异常项需要精算 ✓（偏差均在阈值内）');return;}
  // 配额保护：异常项过多时分批，避免一次打爆高德每日额度
  var MAX_ANOMALY=500;
  var truncated=false;
  if(anomalies.length>MAX_ANOMALY){ anomalies=anomalies.slice(0,MAX_ANOMALY); truncated=true; }
  CHECK_QUEUE=[];
  anomalies.forEach(function(r){
    CHECK_QUEUE.push({
      station:r.station,area:r.area,depot:r.depot,
      tableDist:r.tableDist,
      depotLng:r.depotLng,depotLat:r.depotLat,
      depotAddr:r.depotAddr,
      location:'',
      coords:{lng:r.destLng,lat:r.destLat},   // 直接用油站AW列坐标，跳过geocode
      city:'',district:''
    });
  });
  CHECK_TOTAL=CHECK_QUEUE.length;CHECK_DONE=0;CHECKING=true;
  document.getElementById('startBtn').disabled=true;
  document.getElementById('startBtn').textContent='⏳ 精算中...';
  var cb=document.getElementById('cancelBtn');if(cb)cb.style.display='';
  document.getElementById('progressBar').style.display='block';
  var pb=document.getElementById('pbar'); if(pb){pb.style.background='#7B1F1F';pb.style.width='0%';}
  var pl=document.getElementById('progressLabel'); if(pl){pl.textContent=' 🔄 高德精算异常项中…';pl.style.color='#7B1F1F';}
  _checkFinished=false;_checkStartTs=Date.now();_checkStartDone=CHECK_DONE;
  msg('i','开始高德精算异常项，共 '+CHECK_TOTAL+' 条（仅异常项，省配额；复用坐标K×AW）'+(truncated?'（异常项过多，仅取前'+MAX_ANOMALY+'个，建议调高阈值后再精算）':''));
  pumpCheck();
}

function pumpCheck(){
  if(!CHECKING){ if(_active===0) finishWhenIdle(); return; }
  while(CHECK_QUEUE.length>0 && _active<MAX_CONCURRENT){
    _active++;
    processOneCheck(CHECK_QUEUE.shift());
  }
  if(CHECK_QUEUE.length===0 && _active===0){
    CHECKING=false; finishWhenIdle();
  }
}
function processOneCheck(item){
  if(item.mode!=='customer') item.mode='station';
  var destAddr = item.mode==='customer' ? item.destAddr : (item.location || item.station);
  // 如果油站已有经纬度坐标（来自上传文件的「经纬度」列），跳过地理编码直接算路线
  if(item.coords && item.coords.lng && item.coords.lat){
    console.log('[DEBUG] 跳过geocode,使用坐标:',item.station,item.coords.lng+','+item.coords.lat);
    runDrivingOrCache(item,item.coords.lng,item.coords.lat);
    return;
  }
  console.log('[DEBUG] 需要geocode:',item.station,'地址=',destAddr);
  // 地理编码缓存：同地址不重复请求
  if(GEO_CACHE[destAddr]){
    var c=GEO_CACHE[destAddr];
    runDrivingOrCache(item,c.lng,c.lat);
    return;
  }
  // v1.99 策略：先用 POI 文本搜索（容错强），再 geocode
  poiTextSearch(item.station, item.city||item.area).then(function(coord){
    GEO_CACHE[destAddr]=coord;
    console.log('[DEBUG] POI搜索成功:',item.station,'->',coord.lng+','+coord.lat);
    runDrivingOrCache(item,coord.lng,coord.lat);
  }).catch(function(){
    // POI失败再走geocode
    geocodeREST(destAddr).then(function(coord){
      GEO_CACHE[destAddr]=coord;
      runDrivingOrCache(item,coord.lng,coord.lat);
    }).catch(function(err){
      console.warn('[复核] 地理编码失败:',destAddr,err&&err.message);
      recordResult(item,'geocode_fail',null);
      afterOneDone();
    });
  });
}

// v1.99 POI 文本搜索：用站名+城市，容错性远强于 geocode
function poiTextSearch(station, area){
  return new Promise(function(resolve,reject){
    var city=area||'';
    var url='https://restapi.amap.com/v3/place/text?key='+AMAP_KEY+'&keywords='+encodeURIComponent(station)+'&city='+encodeURIComponent(city)+'&citylimit=true&offset=3&extensions=base';
    var timer=setTimeout(function(){reject(new Error('POI搜索超时(6s)'));},6000);
    fetch(url).then(function(r){return r.json();}).then(function(d){
      clearTimeout(timer);
      if(d&&d.status==='1'&&d.pois&&d.pois.length>0){
        var loc=d.pois[0].location.split(',');
        resolve({lng:parseFloat(loc[0]),lat:parseFloat(loc[1]),name:d.pois[0].name});
      }else{
        reject(new Error('POI无结果'));
      }
    }).catch(function(err){clearTimeout(timer);reject(err);});
  });
}
function runDrivingOrCache(item,destLng,destLat){
  var key=drvKey(item.depotLng,item.depotLat,destLng,destLat);
  // 驾车距离缓存：相同(油库,目的地)复用，极大减少高德请求
  if(DRIVING_CACHE[key]!=null){
    recordResult(item,'ok_cache',DRIVING_CACHE[key],destLng,destLat);
    afterOneDone();
    return;
  }
  checkDriving(item,destLng,destLat);
}
function afterOneDone(){
  CHECK_DONE++;
  updateProgress();
  var now=Date.now();
  // 节流持久化：每 20 条或 5 秒一次，降低 sessionStorage 写开销
  if(CHECK_DONE%20===0 || now-_lastSave>5000){ saveState(); _lastSave=now; }
  _active--;
  if(!CHECKING){ if(_active===0) finishWhenIdle(); return; }
  setTimeout(pumpCheck,0);
}
function finishWhenIdle(){
  if(_checkFinished) return;
  _checkFinished=true;
  finishCheck();
}
function drvKey(lng1,lat1,lng2,lat2){
  function r(x){return Math.round(x*10000)/10000;}
  return r(lng1)+','+r(lat1)+'|'+r(lng2)+','+r(lat2);
}
function checkDriving(item, destLng, destLat){
  // 使用高德 REST API（比 JSAPI AMap.Driving 在当前环境更稳定快速）
  var _drvKey=drvKey(item.depotLng,item.depotLat,destLng,destLat);
  var url='https://restapi.amap.com/v3/direction/driving?origin='+item.depotLng+','+item.depotLat+'&destination='+destLng+','+destLat+'&key='+AMAP_KEY+'&extensions=all&strategy=10';
  fetch(url).then(function(r){return r.json();}).then(function(d){
    if(d&&d.route&&d.route.paths&&d.route.paths[0]){
      var gaodeDist=Math.round(parseFloat(d.route.paths[0].distance)/1000);
      DRIVING_CACHE[_drvKey]=gaodeDist;
      recordResult(item,'ok',gaodeDist,destLng,destLat);
    }else{
      var estDist=Math.round(geoDist(item.depotLat,item.depotLng,destLat,destLng)*1.3);
      recordResult(item,'driving_fail',estDist,destLng,destLat);
    }
    afterOneDone();
  }).catch(function(err){
    console.error('[复核] 驾车路线请求异常:',err);
    var estDist=Math.round(geoDist(item.depotLat,item.depotLng,destLat,destLng)*1.3);
    recordResult(item,'driving_fail',estDist,destLng,destLat);
    afterOneDone();
  });
}

// ===== 地理编码 REST API（带 8 秒超时保护）=====
function geocodeREST(addr){
  var url='https://restapi.amap.com/v3/geocode/geo?address='+encodeURIComponent(addr)+'&city=广西&key='+AMAP_KEY;
  var reqP=new Promise(function(resolve,reject){
    fetch(url).then(function(r){return r.json();}).then(function(d){
      if(d&&d.status==='1'&&d.geocodes&&d.geocodes.length>0){
        var loc=d.geocodes[0].location.split(',');
        resolve({lng:parseFloat(loc[0]),lat:parseFloat(loc[1])});
      }else{
        reject(new Error('高德返回空地理编码'));
      }
    }).catch(function(err){reject(err);});
  });
  var timeoutP=new Promise(function(resolve,reject){
    setTimeout(function(){reject(new Error('地理编码超时(8s)'));},8000);
  });
  return Promise.race([reqP,timeoutP]);
}

function recordResult(item, method,lua, calcDist, destLng, destLat){
  var threshold=parseFloat(document.getElementById('thresholdKm').value)||5;
  var diff=calcDist!==null?item.tableDist-calcDist:null;
  var status='unknown';
  if(diff!==null){
    status=Math.abs(diff)<=threshold?'ok':(diff>0?'over':'under');
  }

  var key=item.mode==='customer'?(item.depot+'|'+item.station+'|'+Math.random().toString(36).slice(2,6)):(item.station+'_'+item.depot);
  CHECK_RESULTS[key]={
    station:item.station,area:item.area,depot:item.depot,
    tableDist:item.tableDist,calcDist:calcDist,

  CHECKING=false;
  CHECK_QUEUE=[];
  msg('w','已停止复核，已完成的 '+CHECK_DONE+' 条结果已保留');
  finishCheck();
}

function updateProgress(){
  var pct=Math.round(CHECK_DONE/CHECK_TOTAL*100);
  document.getElementById('pbar').style.width=pct+'%';
  var eta='';
  if(CHECK_DONE>0 && CHECK_DONE<CHECK_TOTAL && _checkStartTs>0){
    var elapsed=(Date.now()-_checkStartTs)/1000;
    var rate=CHECK_DONE/(elapsed||1);
    var remain=(CHECK_TOTAL-CHECK_DONE)/rate;
    var m=Math.floor(remain/60), sec=Math.round(remain%60);
    eta=' · 预计剩余 '+m+'分'+sec+'秒';
  }
  document.getElementById('progressText').textContent=CHECK_DONE+'/'+CHECK_TOTAL+' ('+pct+'%)'+eta;
}

// ===== 近似估算（坐标） =====
function geoDist(lat1,lon1,lat2,lon2){
  var R=6371;
  var dLat=(lat2-lat1)*Math.PI/180;
  var dLon=(lon2-lon1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function getAreaCenter(area){
  if(!area)return null;
  for(var a in AREA_CENTERS){
    if(area.indexOf(a)>=0)return AREA_CENTERS[a];

  // 取第一个字匹配
  for(var a in AREA_CENTERS){
    if(area.indexOf(a.substring(0,2))>=0)return AREA_CENTERS[a];
  }
  return null;
}

  d.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;';
  d.innerHTML='<div style="background:#fff;border-radius:12px;max-width:800px;width:90%;max-height:80vh;overflow:auto;">'+
    '<div style="padding:16px 20px;border-bottom:1px solid #e8e8e8;display:flex;justify-content:space-between;align-items:center;">'+
    '<b>油库列匹配详情</b><button class="btn btn-o btn-sm" onclick="this.parentElement.parentElement.parentElement.remove()">关闭</button></div>'+
    '<div style="padding:16px 20px;">'+html+'</div></div>';
  document.body.appendChild(d);
}

init();
</script>
</body>
