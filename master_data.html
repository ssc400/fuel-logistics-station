.match-badge{display:inline-block;padding:2px 10px;border-radius:4px;font-size:11px;font-weight:600}

<body>
<div class="container">
  <div class="md-header">
    <div class="md-title">🛠 主数据维护</div>
    <div class="md-sub">油库一次吨油运费 · 加油站二次运距｜仅用于主数据维护，保存后立即生效</div>
    <div class="md-stat" id="mdStatus">正在加载主数据…</div>
  </div>
<!-- ===== 主数据维护 ===== -->
  <div id="masterSection" style="display:block">
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;">
      <div class="upload-card"><h4>🚛 一次运费表（批量）</h4><p>上传更新油库固定运费</p>
        <button class="btn btn-primary btn-sm" onclick="document.getElementById('freightInput').click()">选择文件</button>
        <input type="file" id="freightInput" accept=".xlsx,.xls" style="display:none" onchange="uploadFreightData(event)">
        <div class="file-name" id="freightFileName"></div><div class="file-status" id="freightStatus"></div></div>
      <div class="upload-card"><h4>🗺️ 二次运距表（批量）</h4><p>上传更新油库-加油站运距</p>
        <button class="btn btn-primary btn-sm" onclick="document.getElementById('distanceInput').click()">选择文件</button>
        <input type="file" id="distanceInput" accept=".xlsx,.xls" style="display:none" onchange="uploadDistanceData(event)">
        <div class="file-name" id="distanceFileName"></div><div class="file-status" id="distanceStatus"></div></div>
      <div class="upload-card" style="border-style:solid;border-color:#7B1F1F;background:#ebf8ff;"><h4>🔄 恢复默认数据</h4><p>回到系统初始数据</p>
        <button class="btn btn-outline btn-sm" onclick="resetToDefault()">恢复默认</button>
        <div class="file-status ok" id="resetStatus"></div></div>
      <div class="upload-card" style="border-style:solid;border-color:#2b6cb0;background:#ebf8ff;"><h4>📦 备份与恢复</h4><p>导出/导入主数据备份 JSON</p>
        <button class="btn btn-primary btn-sm" onclick="exportMasterBackup()">📥 导出备份</button>
        <button class="btn btn-outline btn-sm" onclick="document.getElementById('masterBackupInput').click()">📤 导入恢复</button>
        <input type="file" id="masterBackupInput" accept=".json" style="display:none" onchange="importMasterBackup(event)">
        <div class="file-status ok" id="masterBackupStatus"></div></div>
    </div>
    <div style="background:#fff;border-radius:10px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:10px;">🏭 油库一次运费（单独编辑）</h3>
      <p style="font-size:12px;color:#718096;margin-bottom:10px;">直接修改各油库各油品的一次运费（元/吨），修改后点保存立即生效。</p>
      <div id="freightMatrix" style="overflow-x:auto;"></div>
      <div style="margin-top:8px;display:flex;gap:10px;align-items:center;">
        <button class="btn btn-success btn-sm" onclick="saveFreightMatrix()">💾 保存修改</button>
        <span class="file-status ok" id="freightMatrixStatus"></span>
      </div>
    </div>
    <div style="background:#fff;border-radius:10px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);">
      <h3 style="font-size:15px;font-weight:700;margin-bottom:10px;">⛽ 加油站运距（维护）</h3>
      <p style="font-size:12px;color:#718096;margin-bottom:10px;">按「地区」整区查看批量修改，或输入站名模糊搜索定位单站。修改后点保存立即生效。</p>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;">

        <span id="sdFilterInfo" style="font-size:12px;color:#4a5568;"></span>
      </div>
      <div id="stationDistEditor" style="overflow-x:auto;"></div>
      <div style="margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <button class="btn btn-success btn-sm" onclick="saveStationDist()">💾 保存运距</button>
        <span class="file-status ok" id="stationDistStatus"></span>
        <div id="sdPager" style="margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;"></div>

    </div>
  </div> <!-- masterSection -->

<div id="_compat" aria-hidden="true"><div id="statStations"></div><div id="statDepots"></div><div id="statDepotsDetail"></div><div id="statRegions"></div><div id="statFiltered"></div><div id="statFilteredDetail"></div><div id="statSource"></div><div id="statStatus"></div><select id="productSelect"></select><div id="msRegion"></div><select id="typeFilter"></select><select id="companyFilter"></select><input id="stationSearch"><button id="availBtn"></button><div id="tabStation"></div><div id="tabDepot"></div><div id="tabPlan"></div><div id="tabDist"></div><div id="tabMaster"></div><div id="depotSelector"></div><select id="depotSelect"></select><span id="depotStats"></span><div id="planSection"></div><div id="planUploadBox"></div><input id="planCsvInput"><div id="planFileInfo"></div><div id="planSummary"></div><div id="planFilterBar"></div><div id="msRank"></div><div id="msOwnRank"></div><div id="msCheck"></div><div id="msPlanRegion"></div><div id="msProduct"></div><select id="planTypeFilter"></select><select id="planTonsFilter"></select><input id="planSearchInput"><div id="planTableWrap"></div><div id="planTableContainer"></div><span id="planRowCount"></span><div id="stationSection"></div><input id="salesFileInput"><span id="salesStatus"></span><span id="salesSummary"></span><div id="tableContainer"></div><span id="rowCount"></span><span id="calcRule"></span><div id="distSection"></div><input id="distStationSearch"><input id="distDepotSearch"><select id="distTypeFilter"></select><span id="distStats"></span><div id="distTableContainer"></div><span id="distRowCount"></span><div id="availModalOverlay"></div><input id="availImportInput"><span id="availStatus"></span><select id="availPresetSelect"></select><input id="availPresetName"><input id="availPresetImport"><span id="availPresetStatus"></span><tbody id="availTableBody"></tbody><input id="pgInput"><div id="planProgText"></div><div id="planProgFill"></div><input id="planPgInput"></div>
<script>

let appData=null,defaultData=null,salesData={},stationResults=[],dataModified=false,currentView='master',productAvailability={},availPresets=[],availActivePreset=null;
const AV_KEY='avail_presets_v1',AV_ACTIVE_KEY='avail_active_preset';
const PK=['0','92','E92','95','98'],PN={'0':'0#','92':'92#','E92':'E92#','95':'95#','98':'98#'},FF={'0':'f0','92':'f92','E92':'fE92','95':'f95','98':'f98'};

function pdExcel(wb){
  if(!wb||!wb.SheetNames||!wb.SheetNames.length)return null;
  const S=v=>String(v==null?'':v).trim();
  // v3.08 按《加油站运距_补充修正部分》模板精确排除属性列/销量列/派生列
  const ATTR_EXACT=new Set(['序号','地区','区域','加油站站名','站名','加油站名称','经度','纬度','经纬度','地址','城市','区县',
    '匹配状态','负责人','性质','加油站编码','编码','E92#汽油','92#汽油','95#汽油','98#汽油','汽油小计','柴油小计',
    '年度合计','日度合计','地理位置','备注','库类型','出库点类型','车牌','司机','电话','起运','到达','日期','时间']);
  const ATTR_KEYS=['小计','合计','自有库第一出库点','第一出库点','经度','纬度','经纬度','地址','负责人','性质','匹配状态','销量','地理位置','编码','序号','地区','站名'];
  const isAttr=s=>{if(ATTR_EXACT.has(s))return true;for(const k of ATTR_KEYS){if(s.indexOf(k)>=0)return true;}return false;};
  const isDepotish=s=>s.indexOf('油库')>=0||s.indexOf('直发库')>=0||s.indexOf('出库点')>=0||s.indexOf('库')>=0||s.indexOf('石化')>=0||s.indexOf('储油')>=0;
  // 选 sheet：油库列名命中最多者，其次数值列最多者
  let ws=null,bestName=-1,bestNum=-1;
  for(const sn of wb.SheetNames){
    const t=wb.Sheets[sn];if(!t)continue;
    const r0=XLSX.utils.sheet_to_json(t,{header:1,defval:''});const h0=r0[0]||[];
    let cName=0,cNum=0;
    for(let j=0;j<h0.length;j++){const v=S(h0[j]);if(!v)continue;if(isDepotish(v)&&!isAttr(v))cName++;if(!isAttr(v))cNum++;}
    if(cName>bestName||(cName===bestName&&cNum>bestNum)){bestName=cName;bestNum=cNum;ws=t;}
  }
  if(!ws)return null;
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  if(!rows||rows.length<2)return null;
  const h=rows[0]||[];
  let nameCol=-1,regionCol=-1,codeCol=-1,ownerCol=-1;
  for(let j=0;j<h.length;j++){
    const v=S(h[j]);if(!v)continue;
    if(nameCol<0&&(v.indexOf('站名')>=0||(v.indexOf('加油站')>=0&&v.indexOf('编码')<0&&v.indexOf('汽')<0)))nameCol=j;
    if(regionCol<0&&(v==='地区'||v==='区域'))regionCol=j;
    if(codeCol<0&&v.indexOf('编码')>=0)codeCol=j;
    if(ownerCol<0&&(v.indexOf('负责人')>=0||v==='责任区'||v==='客户经理'))ownerCol=j;
  }
  const depotCols=[];
  for(let j=0;j<h.length;j++){
    const v=S(h[j]);if(!v)continue;
    if(j===nameCol||j===regionCol||j===codeCol||j===ownerCol)continue;
    if(isAttr(v))continue;
    if(isDepotish(v)){depotCols.push({idx:j,name:v});continue;}
    // 弱信号兜底：无库名语义但该列存在>0运距数值 → 仍视为油库列（兼容「崇左石化」等命名）
    let hasNum=false;
    for(let i=1;i<rows.length&&!hasNum;i++){const cell=rows[i][j];if(cell!==''&&cell!=null){const d=parseFloat(cell);if(!isNaN(d)&&d>0)hasNum=true;}}
    if(hasNum)depotCols.push({idx:j,name:v});
  }
  if(!depotCols.length)return null;
  const dh={};depotCols.forEach(c=>dh[String(c.idx)]=c.name);
  const st=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];if(!r)continue;
    const n=nameCol>=0?S(r[nameCol]):S(r[2]);if(!n)continue;
    const rg=regionCol>=0?S(r[regionCol]):S(r[1]);
    const code=codeCol>=0?S(r[codeCol]):'';
    const owner=ownerCol>=0?S(r[ownerCol]):'';
    const ds={};
    depotCols.forEach(c=>{const v=r[c.idx];if(v!==''&&v!=null){const d=parseFloat(v);if(!isNaN(d)&&d>0)ds[String(c.idx)]=d;}});
    st.push({region:rg,name:n,distances:ds,refCode:code,code:code,owner:owner});
  }
  return{st,dh};
}

var _msState={};
function initMultiSelect(id,items,onChange){
  var wrap=document.getElementById(id);
  if(!wrap)return;
  var state={items:items||[],vals:(items||[]).map(function(i){return i.value;}),touched:false,onChange:onChange||function(){},ddId:'msdd_'+id};
  _msState[id]=state;

function getMSText(id,s){
  var cnt=s.vals.length,tot=s.items.length;
  if(cnt===0) return '(全部不选)';
  if(cnt===tot) return '全部('+tot+')';
  // 取选中的标签，最多显示4个
  var labels=[];
  s.items.forEach(function(item){
    if(s.vals.indexOf(item.value)>=0) labels.push(item.label);
  });
  if(labels.length<=3) return labels.join('、');
  return '已选'+cnt+'项';
}
function renderMS(id){
  var s=_msState[id];if(!s)return;
  var wrap=document.getElementById(id);if(!wrap)return;
  var cnt=s.vals.length,tot=s.items.length;
  var txt=getMSText(id,s);
  var EH=function(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
  // v3.08 复选框交互修复：事件只绑定到 input 自身（避免 label 二次转发导致 toggle 两次），
  // 用稳定的 data-i 建立 DOM 与 s.items 的对应关系（避免分组重排后按索引错位）。
  var optHtml=function(i,idx){
    var ck=s.vals.indexOf(i.value)>=0?' checked':'';
    return '<label class="ms-item"><input type="checkbox" data-i="'+idx+'"'+ck+
      ' onclick="event.preventDefault();event.stopPropagation();msToggleValByIdx(\''+id+'\',this.getAttribute(\'data-i\'))">'+
      '<span>'+EH(i.label)+'</span></label>';
  };
  var hasGroup=s.items.some(function(i){return i.group;});
  var itemHtml;
  if(hasGroup){
    var groups={};
    s.items.forEach(function(i,idx){var g=i.group||'_';if(!groups[g])groups[g]=[];groups[g].push({item:i,idx:idx});});
    var gOrder=Object.keys(groups).sort();
    itemHtml=gOrder.map(function(g){
      var gLabel=g==='_'?'':((REGION_GROUPS[g]&&REGION_GROUPS[g].label)||g);
      var hdr=gLabel?'<div class="ms-group-hdr">'+EH(gLabel)+'</div>':'';
      return hdr+groups[g].map(function(x){return optHtml(x.item,x.idx);}).join('');
    }).join('');
  }else{
    itemHtml=s.items.map(function(i,idx){return optHtml(i,idx);}).join('');
  }
  // 重建 DOM 后保持「打开」状态，避免点击选项后下拉突然关闭
  var isOpen=wrap.classList.contains('open');
  wrap.innerHTML='<div class="ms-trigger" onclick="toggleMSDrop(\''+id+'\')"><span>'+EH(txt)+'</span><span class="ms-arrow">▼</span></div>'+
    '<div class="ms-dd" id="'+s.ddId+'" style="display:'+(isOpen?'block':'none')+'" onclick="event.stopPropagation()">'+
    '<label class="ms-all"><input type="checkbox"'+(cnt===tot&&tot>0?' checked':'')+
    ' onclick="event.preventDefault();event.stopPropagation();msToggleAll(\''+id+'\')"> 全选</label>'+
    itemHtml+'</div>';
}
function toggleMSDrop(id){
  var s=_msState[id];if(!s)return;
  var dd=document.getElementById(s.ddId);if(!dd)return;
  var show=dd.style.display!=='block';
  document.querySelectorAll('.ms-dd').forEach(function(el){el.style.display='none';});
  document.querySelectorAll('.ms-wrap').forEach(function(el){el.classList.remove('open');});
  if(show){dd.style.display='block';document.getElementById(id).classList.add('open');}
}
function msToggleValByIdx(id,idx){
  var s=_msState[id];if(!s)return;
  var item=s.items[Number(idx)];if(!item)return;
  msToggleVal(id,item.value);
}
// v3.08：从 s.vals 精确回写 DOM，完全由状态驱动，不依赖浏览器默认 toggle
function syncMSDOM(id){
  var s=_msState[id];if(!s)return;
  var dd=document.getElementById(s.ddId);
  if(dd){
    var all=dd.querySelector('.ms-all input');
    if(all)all.checked=(s.vals.length===s.items.length&&s.items.length>0);
    dd.querySelectorAll('.ms-item input[type=checkbox]').forEach(function(cb){
      var i=s.items[Number(cb.getAttribute('data-i'))];
      if(i)cb.checked=s.vals.indexOf(i.value)>=0;
    });
  }
  var wrap=document.getElementById(id);
  if(wrap){var t=wrap.querySelector('.ms-trigger span:first-child');if(t)t.textContent=getMSText(id,s);}
}
function msToggleVal(id,val){
  var s=_msState[id];if(!s)return;
  s.touched=true;
  var idx=s.vals.indexOf(val);
  if(idx>=0)s.vals.splice(idx,1);else s.vals.push(val);
  syncMSDOM(id);
  s.onChange(s.vals.slice());
}
function msToggleAll(id){
  var s=_msState[id];if(!s)return;
  s.touched=true;
  var dd=document.getElementById(s.ddId);
  var allCb=dd&&dd.querySelector('.ms-all input');
  // preventDefault 已阻止默认 toggle，故 allCb.checked 仍是点击前的状态
  var target=!(allCb&&allCb.checked);
  s.vals=target?s.items.map(function(i){return i.value;}):[];
  syncMSDOM(id);
  s.onChange(s.vals.slice());
}
function getMSVals(id){var s=_msState[id];return s?s.vals.slice():[];}
function setMSItems(id,newItems){
  var s=_msState[id];if(!s)return;
  var changed=false;
  if(s.items.length!==newItems.length)changed=true;
  else{
    for(var si=0;si<s.items.length;si++){
      if(s.items[si].value!==newItems[si].value||s.items[si].label!==newItems[si].label){changed=true;break;}
    }
  }
  s.items=newItems;
  var valid={};newItems.forEach(function(i){valid[i.value]=true;});

function mapProductToKey(p){

function fuzzyMatchStation(csvName,regionHint){
  if(!csvName)return null;
  const n=_normName(csvName);
  if(!n)return null;
  // Level 1: 精确匹配 O(1)
  let m=STATION_INDEX&&(STATION_INDEX.get(n)||STATION_INDEX.get(_normName(csvName)));
  if(m)return m;
  // 候选集：优先同分公司（region），否则全部
  const cand=(regionHint&&regionHint.trim()&&STATIONS_BY_REGION&&STATIONS_BY_REGION[regionHint.trim()])?STATIONS_BY_REGION[regionHint.trim()]:(appData?appData.stations:[]);
  // Level 2: 包含匹配（双向）
  for(const s of cand){const sn=_normName(s.name);if(sn&&(sn.indexOf(n)>=0||n.indexOf(sn)>=0))return s;}
  // Level 3: 字符重叠打分（仅在以上均失败时，范围已限定）
  let best=null,bestScore=0;
  for(const s of cand){
    const sn=_normName(s.name);let score=0;const used=new Set();
    for(const c of n){if(c.trim()&&!used.has(c)){if(sn.indexOf(c)>=0){score+=2;used.add(c);}}}
    const words=sn.match(/[\u4e00-\u9fa5]+/g)||[];
    for(const w of words){if(n.indexOf(w)>=0)score+=w.length*2;}
    if(score>bestScore){bestScore=score;best=s;}
  }
  return bestScore>=6?best:null;
}
function fuzzyMatchDepot(dn){
  if(!dn)return null;
  const n=_normName(dn);
  if(!n)return null;
  let m=DEPOT_INDEX&&DEPOT_INDEX.get(n);
  if(m)return m;
  // 油库数量少，直接扫描兜底
  let best=null,bs=0;
  if(appData){for(const d of appData.depots){let s=0;for(const c of n)if(d.name.indexOf(c)>=0)s++;if(s>bs){bs=s;best=d;}}}
  return bs>=3?best:null;
}
function depotFreight(depot,station,pk,ffOverride){

}

  //                  ② 新增「新恒丰 0#（含珠海油库一次费用）」(f0z，来自一次运费表末列)

      if(needZ){esZ=es.map(e=>e.code===zCode?{...e,ff:zF0,tt:zF0+e.sf}:e);esZ.sort((a,b)=>a.tt-b.tt);}
      const mkRow=(ex,isZ)=>{
        const rkIdx=ex.findIndex(e=>e.code===actualDepot.code);
        const top5=ex.slice(0,5).map(e=>({dn:e.dn,dt:e.dt,dist:e.dist,ff:e.ff,sf:e.sf,tt:e.tt}));
        const fE=ex[0]?{dist:ex[0].dist,ff:ex[0].ff,sf:ex[0].sf,tt:ex[0].tt}:null;
        let aE=null;
        if(rkIdx>=0)aE={dist:ex[rkIdx].dist,ff:ex[rkIdx].ff,sf:ex[rkIdx].sf,tt:ex[rkIdx].tt};
